              minItems: 256
              maxItems: 256
              items:
                type: number
                minimum: 0
                maximum: 1
          description: 'field uses line-major layout: line*256+depth. Echoes counts separated local maxima above 0.05,
            not bright depth bins. coefficients are signed physical interface values before display gain. Envelope uses
            bin-center depths (i+0.5)*100/256.'
    BioPipelineInput:
      type: object
      required:
      - module
      - scene
      properties:
        module:
          const: biopipeline
        scene:
          type: object
          required:
          - source
          - seed
          properties:
            source:
              enum:
              - ECG
              - EMG
              - EEG
            seed:
              type: integer
              minimum: 0
              maximum: 4294967295
          description: 600 samples at 1000 Hz, from t=0. Reuses existing ECG/EMG/EEG source functions, adds DC 0.6 and
            50 Hz sine amplitude 0.5. Then gain x40, full-segment mean subtraction, centered 7-point moving average
            and existing zero-initial-state 50 Hz notch. Amplitude multiplication does not simulate common-mode rejection;
            the moving average is low-pass.
    BioPipelineOutput:
      type: object
      required:
      - module
      - result
      properties:
        module:
          const: biopipeline
        result:
          type: object
          required:
          - series
          - rawMean
          - rawPeak
          - finalPeak
          properties:
            series:
              type: array
              minItems: 5
              maxItems: 5
              items:
                type: array
                minItems: 600
                maxItems: 600
                items:
                  type: number
            rawMean:
              type: number
            rawPeak:
              type: number
              minimum: 0
            finalPeak:
              type: number
              minimum: 0
          description: 'Series order: raw, gain, de-meaned, smoothed, notched. Each has 600 samples. Synthetic acquisition
            illustration only.'
    FdtdInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: fdtd }
        scene:
          type: object
          required: [preset, boundary, shape, time, omega, steps, sources]
          description: >-
            Fixed 200x200 TMz grid in reduced units, zero initial fields and Courant S=0.5.
            Browser and Agent share preset media, PEC masks and soft sources starting at step zero.
            Changing parameters or sources rebuilds the field. Backend chunks yield for cancellation.
          properties:
            preset: { enum: [free, interface, doubleslit, lens, cavity] }
            boundary: { enum: [mur, pec] }
            shape: { enum: [line, point] }
            time: { enum: [pulse, cw] }
            omega: { type: number, minimum: 0.05, maximum: 1.2, description: Source phase increment in radians per lattice step. }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            sources:
              type: array
              minItems: 1
              maxItems: 32
              items:
                type: object
                required: [i, j]
                properties:
                  i: { type: integer, minimum: 1, maximum: 198 }
                  j: { type: integer, minimum: 1, maximum: 198 }
    FdtdOutput:
      type: object
      required: [module, nx, ny, steps, dt, Ez]
      properties:
        module: { const: fdtd }
        nx: { const: 200 }
        ny: { const: 200 }
        steps: { type: integer, minimum: 1, maximum: 2000 }
        dt: { type: number, description: "Reduced timestep 0.5/sqrt(2)." }
        Ez:
          type: array
          minItems: 40000
          maxItems: 40000
          description: Finite electric field samples in row-major order (j*nx+i).
          items: { type: number, minimum: -1.0e20, maximum: 1.0e20 }
    OpticsInput:
      type: object
      required: [module, components]
      properties:
        module: { const: optics-lab }
        components:
          type: array
