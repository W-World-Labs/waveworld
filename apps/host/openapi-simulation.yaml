                  properties:
                    refractiveIndex: { type: number, minimum: 1, maximum: 100 }
                    ePeak: { type: number, minimum: 0, maximum: 1000000 }
    SoundInput:
      allOf:
        - { $ref: '#/components/schemas/WaveInput' }
        - properties:
            module: { const: sound }
