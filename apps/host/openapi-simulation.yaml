    WaveParams:
      type: object
      required: [frequencyHz]
      properties:
        frequencyHz: { type: number, minimum: 0.000001, maximum: 1.0e20 }
        phase0: { type: number, minimum: -1000000, maximum: 1000000 }
    EmInput:
      allOf:
        - { $ref: '#/components/schemas/WaveInput' }
        - properties:
            module: { const: electromagnetic }
            params:
              allOf:
                - { $ref: '#/components/schemas/WaveParams' }
