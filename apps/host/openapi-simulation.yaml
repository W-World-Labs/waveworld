              minimum: 1
              maximum: 2000
          description: 'Zero-current coupled coils: L1=1 H, L2=n^2 H, M=k*n H, R1=2 ohm, R2=4 ohm. Primary
            10 V step or 2 Hz sine, secondary V2=0. Outer dt=1/240 s; 1..5 RK4 substeps ensure h*trace(L^-1
            R)<=2. Sine source sampled at each substep midpoint. run.maxSteps and summary.steps equal scene.steps.'
