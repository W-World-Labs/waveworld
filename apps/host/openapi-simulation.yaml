              description: "cpu is for the teaching modules above. sw-* inputs and exact native algorithm inputs have no browser/JS fallback and must request ['cuda'] ('native-cuda' may be added) so the job routes to the native w-sim-cuda binary. Native algorithm inputs require inline.backend='host'; for mna, method-algo-mna-dc, method-algo-mna-dc-sweep and cst-port-impedance-sweep are separate exact selectors and cannot be supplied together. backend='host' names host-f64 mathematics and does not claim GPU calculation."
