        `backend` is mandatory and selects the math backend inside the binary:
        host = CPU f64, auto = GPU when the kernel's fatbin is embedded else
        host, cuda = GPU or fail-closed. `method` and the remaining fields are
        the binary's own module input (flat or under `params`), admission-
