              allOf:
                - { $ref: '#/components/schemas/WaveParams' }
                - required: [rho, c, pPeak]
                  properties:
                    rho: { type: number, minimum: 0.000001, maximum: 1000000 }
                    c: { type: number, minimum: 0.000001, maximum: 1000000 }
                    pPeak: { type: number, minimum: 0, maximum: 1000000 }
    JobResponse:
      type: object
      required: [job]
      properties:
        job:
          type: object
          required: [id, status]
          properties:
            id: { type: string }
            status: { enum: [queued, leased, running, succeeded, failed, cancelled] }
            attempt: { type: integer, minimum: 0, description: Current 0-based claim attempt; returned by claim responses. }
            compute:
              type: object
              description: Present for managed W-Compute jobs. Job success means results are saved; only phase=stopped confirms instance shutdown. Storage is retained and may continue billing. Unknown phases must be tolerated.
              required: [provider, instanceId, phase, error]
              properties:
                provider: { const: w-compute }
                instanceId: { type: [string, 'null'] }
                phase: { type: string, examples: [queued, quoting, ready, creating, staging, running, collecting, stopping, stopped] }
                error: { type: [string, 'null'] }
            result:
              oneOf:
                - { type: 'null' }
                - { $ref: '#/components/schemas/ModuleResult' }
                - { $ref: '#/components/schemas/LbmResult' }
                - { $ref: '#/components/schemas/MacResult' }
                - { $ref: '#/components/schemas/IgbtSpatialChipResult' }
    JobAttemptOutcomeResponse:
      type: object
      required: [attempt, outcome]
      properties:
        attempt: { type: integer, minimum: 0, maximum: 9007199254740991 }
        outcome: { $ref: '#/components/schemas/JobHostOutcome' }
    JobHostOutcome:
      oneOf:
        - type: object
          required: [jobId, status, result]
          properties:
            jobId: { type: string, format: uuid }
            status: { const: succeeded }
            result:
              oneOf:
                - { $ref: '#/components/schemas/ModuleResult' }
                - { $ref: '#/components/schemas/LbmResult' }
                - { $ref: '#/components/schemas/MacResult' }
                - { $ref: '#/components/schemas/IgbtSpatialChipResult' }
        - type: object
          required: [jobId, status, error]
          properties:
            jobId: { type: string, format: uuid }
            status: { const: failed }
            error: { type: string }
        - type: object
          required: [jobId, status]
          properties:
            jobId: { type: string, format: uuid }
            status: { const: cancelled }
        - type: object
          required: [jobId, status]
          properties:
            jobId: { type: string, format: uuid }
            status: { const: queued, description: This lease attempt was requeued; it is not a claim that the whole job is terminal. }
    MacResult:
      type: object
      required: [schemaVersion, summary, derived, backend, mac]
      not: { required: [moduleResult] }
      description: |
        Only all requested maxSteps may succeed. Summary is the final after-step state;
        optional history contains every absolute sample interval and the final step, with
        timeSeconds=step*saved dt. Last history values match summary. All projection/CFL
        diagnostics are finite, nonnegative and satisfy the submitted hard bounds. No
        Cd/Cl, drag/lift/side force, lattice Reynolds number or converged field is allowed.
        Thermal account reuses source/boundary/residual cumulative definitions: initial
        energy is zero; supplied powers times dt*steps must equal sourceEnergyJ. Total
        energy minus source and boundary inputs agrees with the cumulative residual
        at relative 1e-9 against the energy-account magnitude. Every fan history row
        satisfies its supplied P-Q curve and signed pressure-times-area force. The
        final owned WVM1 frame and every intermediate frame must have matching grid,
        flags, thermal stride and exact scheduled step; each artifact ref.step is mandatory.
        Fields total <=256MiB. Malformed, foreign, missing, reordered, stale-lease or
        conflicting idempotent result payloads are rejected. Saved legacy results stay readable.
      properties:
        schemaVersion: { const: 1 }
        summary:
          type: object
          required: [steps, wallTimeMs, method, solverPackage, solidCells, maxSpeedMps, divergenceLinf, allowedDivergenceLinf, projectionIterations, combinedCfl]
          properties:
            steps: { type: integer, minimum: 1, maximum: 9007199254740991 }
            wallTimeMs: { type: number, minimum: 0 }
            method: { const: mac-3d }
            solverPackage: { const: w-sim-kernels }
            solidCells: { type: integer, minimum: 1 }
            maxSpeedMps: { type: number, minimum: 0 }
            divergenceLinf: { type: number, minimum: 0 }
            allowedDivergenceLinf: { type: number, exclusiveMinimum: 0 }
            projectionIterations: { type: integer, minimum: 0, maximum: 4096 }
            combinedCfl: { type: number, minimum: 0, maximum: 1 }
        derived:
          type: object
          required: [dx, dt, precision, engine, mac-3d-v1, viscosityM2s, cellCount, openFaces]
          properties:
            dx: { type: number, exclusiveMinimum: 0 }
            dt: { type: number, exclusiveMinimum: 0 }
            precision: { const: float64 }
            engine: { enum: [rust-native, rust-wasm] }
            mac-3d-v1: { const: 1 }
            viscosityM2s: { type: number, exclusiveMinimum: 0 }
            cellCount: { type: integer, minimum: 27, maximum: 1048576 }
            openFaces: { type: integer, minimum: 0, maximum: 63 }
        mac:
          type: object
          required: [samplePhase, fans]
          properties:
            samplePhase: { const: before-momentum-step }
            fans:
              type: array
              maxItems: 16
              items:
                type: object
                required: [name, plane, faceCount, areaM2, flowM3s, pressureRisePa, forceN]
                properties:
                  name: { type: string }
                  plane: { type: integer, minimum: 1 }
                  faceCount: { type: integer, minimum: 1 }
                  areaM2: { type: number, exclusiveMinimum: 0 }
                  flowM3s: { type: number, minimum: 0 }
                  pressureRisePa: { type: number, minimum: 0 }
                  forceN: { type: number, description: Signed actuator force along the positive selected grid axis; direction*pressureRisePa*areaM2, not aerodynamic body force. }
        history:
          type: object
          required: [step, timeSeconds, maxSpeedMps, divergenceLinf, projectionIterations, combinedCfl]
          additionalProperties: { type: array, items: { type: number } }
          description: Also fan{i}FlowM3s, fan{i}PressurePa, fan{i}ForceN for every submitted fan; arrays share step length and fan sampling phase.
        thermal: { $ref: '#/components/schemas/LbmResult/properties/thermal' }
        backend:
          type: object
          required: [id]
          properties:
            id: { const: cpu }
            agentId: { type: string }
        artifacts:
          type: array
          maxItems: 16
          items:
            type: object
            required: [artifactId, kind, contentType, bytes, step]
            properties:
              artifactId: { type: string, format: uuid }
              kind: { const: mac-flow-field }
              contentType: { const: application/vnd.waveworld.mac-field-v1 }
              bytes: { type: integer, minimum: 32, maximum: 33554432 }
              step: { type: integer, minimum: 1 }
    LbmMassBalance:
      type: object
      description: |
        Optional for historical results; mandatory for newly normalized LBM tasks.
        Control volume contains flag=0 cells with 1 <= x <= nx-2. All quantities are
        finite kilograms, converted once from lattice mass by referenceDensity*dx^3.
        Coverage includes every executed step from 1 to summary.steps, including force
        warmup and unsampled steps. No division by dt is used for cumulative transport.
        Transport is measured from actual post-collision populations crossing the two
        internal sections with the actual streaming donor/wall mapping. Inlet is signed
        into the control volume; outlet is signed out. Negative net transport is allowed.
        Per-step residual = bulkAfter - bulkBefore - inlet + outlet - collisionChange.
        The reported residual is the sum of these independently measured step residuals;
        maxAbsStepBalanceResidualKg is the true maximum absolute global step residual,
        not a maximum workgroup or sampled-interval residual. It includes propagation,
        moving-wall and reduction arithmetic effects. Density drift is not this residual.
        Numerical x-boundary layers are excluded from the volume. Their final mass and
        separate signed NEE replacement amounts are reported, not relabeled as flow.
        These diagnostics neither establish convergence nor measure engineering accuracy.
        Missing historical reports mean unrecorded, never zero.
      required: [scope, initialMassKg, finalMassKg, inletMassKg, outletMassKg, collisionMassChangeKg, balanceResidualKg, maxAbsStepBalanceResidualKg, boundaryFinalMassKg, inletReconstructionMassKg, outletReconstructionMassKg]
      properties:
        scope: { const: internal-fluid-x }
        initialMassKg: { type: number, exclusiveMinimum: 0 }
        finalMassKg: { type: number, exclusiveMinimum: 0 }
        inletMassKg: { type: number }
        outletMassKg: { type: number }
        collisionMassChangeKg: { type: number, description: Actual FP32-written post-collision populations minus pre-collision populations in the control volume. }
        balanceResidualKg: { type: number }
        maxAbsStepBalanceResidualKg: { type: number, minimum: 0 }
        boundaryFinalMassKg: { type: number, minimum: 0 }
        inletReconstructionMassKg: { type: number, description: Accumulated after-minus-before NEE replacement in the excluded xMin numerical layer. }
        outletReconstructionMassKg: { type: number, description: Accumulated after-minus-before NEE replacement in the excluded xMax numerical layer. }
    LbmResult:
      type: object
      required: [schemaVersion, summary, backend]
      not:
        anyOf:
          - { required: [moduleResult] }
          - { required: [mac] }
          - properties:
              summary:
                required: [method]
                properties: { method: { const: thermal-igbt-spatial-chip-v1 } }
          - properties:
              summary:
                required: [method]
                properties: { method: { const: thermal-igbt-spatial-chip-v1 } }
      properties:
        schemaVersion: { const: 1 }
        lbmMassBalance: { $ref: '#/components/schemas/LbmMassBalance' }
        thermal:
          type: object
          description: Required for thermal LBM. Final energy relative to ambient; input and residual are cumulative over executed steps. Positive boundary energy enters the domain, including fixed-temperature surfaces. All materials start at ambient in solid-power mode. Settlement requires the requested backend/precision and all maxSteps. Source energy must match (totalPowerW + sum(thermalRegions.totalPowerW))*dtSeconds*steps (relative tolerance 2e-6 for GPU or 1e-9 for CPU); fixed-temperature source energy is zero. CPU and GPU fields/accounts agree within numerical tolerance, not bitwise.
          required: [mode, thermalEnergyJ, sourceEnergyJ, boundaryEnergyJ, energyResidualJ, maxAbsEnergyResidualJ, solidMaxC, fluidMaxC, thermalSubsteps, solidVolumeM3]
          properties:
            mode: { enum: [fixed-temperature, solid-power] }
            thermalEnergyJ: { type: number }
            sourceEnergyJ: { type: number, minimum: 0 }
            boundaryEnergyJ: { type: number }
            energyResidualJ: { type: number, description: Sum of per-step energy-after minus energy-before minus source and boundary inputs. }
            maxAbsEnergyResidualJ: { type: number, minimum: 0 }
            solidMaxC: { type: number, exclusiveMinimum: -273.15, description: Maximum solid temperature in the final step. }
            fluidMaxC: { type: number, exclusiveMinimum: -273.15, description: Maximum fluid temperature in the final step. }
            thermalSubsteps: { type: integer, minimum: 1, description: Maximum number of thermal substeps used in any executed fluid step. }
            solidVolumeM3: { type: number, exclusiveMinimum: 0, description: Actual voxelized solidCells times dx cubed. }
        derived:
          type: object
          description: Product mesh LBM (gridPreset present) settlement requires the three viscosity diagnostics. Physical mode must preserve the requested value; preview may only increase it. Historical results remain readable without these fields.
          allOf:
            - { $ref: '#/components/schemas/StructuralFields' }
          properties:
            fieldFormat: { enum: [float64-le-x-fastest-v1], description: Native transient temperature bytes are headerless IEEE-754 binary64 little-endian in x-fastest order. Required for new thermal-3d-transient completion. }
            fieldArtifactId: { type: string, description: Stored thermal-temperature-field artifact ID after Agent upload. }
            historyArtifactId: { type: string, description: Stored thermal-history application/json artifact ID; bytes decode to the exact result history. }
            fieldBytes: { type: integer, minimum: 8, description: Exactly gridNx times gridNy times gridNz times eight for the transient field. }
            fieldInline: { enum: [0, 1], description: Native transient temperatures are inlined only for at most 256 nodes; full field artifact is always stored. }
            temperatureCsv: { type: string, description: For new native transient completion with at most 256 nodes this is required and has exactly one finite decimal/exponent value per x-fastest field cell; parsed values must equal the saved binary64 values with signed zero equivalent. Forbidden above 256 nodes. }
            viscosityMode: { enum: [physical, stabilized-preview] }
            groundMode: { enum: [stationary, moving], description: Required exactly when the submitted LBM job enables ground. }
            groundClearanceM: { type: number, minimum: 0, description: Must equal the submitted clearanceM; geometry is voxelized at the stated dx. }
            groundVelocityMps: { type: number, minimum: 0, description: Must equal inletVelocity for moving ground or zero for stationary ground. }
            lbm-pressure-field-v1: { const: 1, description: Required only when pressure field output is requested. }
            pressureScalePa: { type: number, exclusiveMinimum: 0, description: Required for pressure fields. Saved finite scale equals submitted fluidDensity times (prepared dx / dt) squared; multiply the WVF2 lattice pressure channel by it to obtain gauge Pa. Host relative consistency tolerance is 1e-9. }
            lbm-mass-balance-v1: { const: 1, description: Required with lbmMassBalance for all new LBM results. }
            lbm-nee-inlet-v1: { const: 1, description: Required for new LBM results; xMin uses prescribed velocity and density plus nonequilibrium populations from the current streamed inner fluid node. }
            lbm-nee-outlet-v1: { const: 1, description: Required for new LBM results; xMax pressure outlet extrapolates nonequilibrium populations from the current streamed inner fluid node. }
            lbm-gauge-force-v1: { const: 1, description: Required for every new LBM result; model force relative to fixed lattice rho_ref=1, excluding ground reaction. Missing on historical raw-force results. }
            lbm-ground-v1: { const: 1, description: Required for settlement of a ground-enabled job. }
            lbm-field-history-v1: { const: 1, description: Required when requested fieldFrames exceeds one. }
            requestedViscosityM2s: { type: number, exclusiveMinimum: 0, description: Requested base kinematic viscosity in m2/s. }
            simulatedViscosityM2s: { type: number, exclusiveMinimum: 0, description: Actual base kinematic viscosity in m2/s, excluding local LES eddy viscosity. }
            ambientC: { type: number, exclusiveMinimum: -273.15 }
            temperatureScaleC: { type: number, exclusiveMinimum: 0, description: 1 kelvin for solid-power; heatSourceTemp minus ambientTemp for fixed-temperature. }
            thermalDiffusivityPhysical: { type: number, exclusiveMinimum: 0, description: Fluid k divided by density and specific heat, in m2/s. }
        artifacts:
          type: array
          maxItems: 16
          description: >-
            When fields are requested, lbm-display entries must exactly match the actual
            sampling schedule in ascending step order, with the final frame last. Each
            belongs to this job and has the same grid, units and mask; total bytes are
            limited to 268435456. For fieldFrames greater than one each reference must
            include step matching its decoded WVF1/WVF2 header. Legacy final-only references
            may omit step. Native output filenames are flow-{step}.bin for intermediate
            frames and flow.bin for the final frame; the compute result files include step.
          items:
            type: object
            required: [kind, artifactId, contentType, bytes]
            properties:
              kind: { type: string }
              artifactId: { type: string, format: uuid }
              contentType: { type: string }
              bytes: { type: integer, minimum: 1, maximum: 33554432 }
              step: { type: integer, minimum: 1, description: Actual solver step of this WVF1/WVF2 frame. }
        summary:
          type: object
          description: >-
            LBM settlement requires actual integer steps in 1..run.maxSteps, nonnegative
            wall time, and finite dragN/liftN when forces are requested. Early completion
            is accepted only at a post-warmup force sample with a complete returned Cd
            window whose population variance meets the submitted maxCdVariance. Reaching
            maxSteps or meeting this criterion does not assert engineering convergence.
            Force/coefficient values describe the last sampled interval, while fields
            describe the actual final step. Historical successful results remain readable
            and unchanged on an identical idempotent retry.
          required: [steps, wallTimeMs]
          properties:
            steps: { type: integer, minimum: 1, maximum: 9007199254740991 }
            wallTimeMs: { type: number, minimum: 0 }
            cd: { type: number, description: Defined only for a positive inlet reference velocity; omitted at zero inlet. }
            cl: { type: number, description: Defined only for a positive inlet reference velocity; omitted at zero inlet. }
            dragN: { type: number }
            liftN: { type: number }
            sideN: { type: number, description: Signed z-axis force; missing means not computed. }
        backend:
          type: object
          required: [id, agentId]
          properties:
            id: { type: string }
            agentId: { type: string }
        history:
          type: object
          description: >-
            Present when requested or when maxCdVariance is supplied, including outputs.history=false,
            so stopping can be verified. Every included array must use the exact absolute
            forceSampleEvery multiples after warmup and the actual final step in strictly
            increasing integer order. Each value averages the steps since the previous
            sample or warmup boundary; history.step records that interval's end. The
            final point of each supplied force/coefficient equals its summary value.
            warmupSteps=maxSteps yields empty history and a final warmup-block summary.
            At zero inlet, cd/cl arrays are omitted and physical forces in N remain.
          properties:
            step: { type: array, items: { type: integer, minimum: 1 } }
            cd: { type: array, items: { type: number } }
            cl: { type: array, items: { type: number } }
            dragN: { type: array, items: { type: number } }
            liftN: { type: array, items: { type: number } }
            sideN: { type: array, items: { type: number } }
    ModuleResult:
      type: object
      required: [schemaVersion, summary, backend, moduleResult]
      properties:
        schemaVersion: { const: 1 }
        summary:
          type: object
          required: [steps, wallTimeMs]
          properties:
            steps: { type: integer, minimum: 1, maximum: 2000, description: Must equal the submitted run.maxSteps. }
            wallTimeMs: { type: number, minimum: 0 }
        backend:
          type: object
          required: [id, agentId]
          properties:
            id: { const: cpu }
            agentId: { type: string }
        moduleResult:
          description: Included in the settlement fingerprint; all numeric fields must be finite. Arrays use ordinary JSON arrays, never typed-array objects.
          oneOf:
            - { $ref: '#/components/schemas/OpticsOutput' }
            - { $ref: '#/components/schemas/EmOutput' }
            - { $ref: '#/components/schemas/SoundOutput' }
            - { $ref: '#/components/schemas/FdtdOutput' }
            - { $ref: '#/components/schemas/Heat2DOutput' }
            - { $ref: '#/components/schemas/Heat1DOutput' }
            - { $ref: '#/components/schemas/MdOutput' }
            - { $ref: '#/components/schemas/IsingOutput' }
            - { $ref: '#/components/schemas/VibrationOutput' }
            - { $ref: '#/components/schemas/RippleOutput' }
            - { $ref: '#/components/schemas/ConvectionOutput' }
            - { $ref: '#/components/schemas/DisplayOutput' }
            - { $ref: '#/components/schemas/ParticleOutput' }
            - { $ref: '#/components/schemas/FluidOutput' }
            - { $ref: '#/components/schemas/LocalizationOutput' }
            - { $ref: '#/components/schemas/TdoaOutput' }
            - { $ref: '#/components/schemas/StmOutput' }
            - { $ref: '#/components/schemas/AfmOutput' }
            - { $ref: '#/components/schemas/RlcOutput' }
            - { $ref: '#/components/schemas/MutualOutput' }
            - { $ref: '#/components/schemas/TransientOutput' }
            - { $ref: '#/components/schemas/FaradayOutput' }
            - { $ref: '#/components/schemas/SmithOutput' }
            - { $ref: '#/components/schemas/EcgOutput' }
            - { $ref: '#/components/schemas/EegOutput' }
            - { $ref: '#/components/schemas/EmgOutput' }
            - { $ref: '#/components/schemas/NeuronOutput' }
            - { $ref: '#/components/schemas/UltrasoundOutput' }
            - { $ref: '#/components/schemas/BioPipelineOutput' }
            - { $ref: '#/components/schemas/PhasedArrayOutput' }
            - { $ref: '#/components/schemas/NljdOutput' }
            - { $ref: '#/components/schemas/SignalArrayOutput' }
            - { $ref: '#/components/schemas/RadarOutput' }
            - { $ref: '#/components/schemas/EmWave3DOutput' }
            - { $ref: '#/components/schemas/AntennaPatternOutput' }
            - { $ref: '#/components/schemas/Antenna3DOutput' }
            - { $ref: '#/components/schemas/LaserOutput' }
    Samples: { type: array, maxItems: 2048, items: { type: number } }
    EmOutput:
