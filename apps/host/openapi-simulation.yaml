openapi: 3.1.0
info:
  title: WaveWorld simulation compute extensions
  version: 1.56.14
  description: |
    Independent review operator configuration (source edition): submission requires
    WAVEWORLD_REVIEW_ISSUE_URL to identify one canonical HTTPS repository issue.
    Missing/invalid configuration returns503. The legacy payload field
    giteaIssue46CommentUrl is retained; its URL must match the configured origin,
    repository and issue, with no credentials/query and only an optional numeric
    issuecomment fragment. OIDC, non-owner review, immutable publication digests,
    semantic verification and mutation rejection are unchanged.
    [CONTRACT IMPACT] Public-source operators must explicitly configure this URL;
    no private issue default, deployment change or stored-data migration occurs.
    Knowledge job resolution (1.56.13): `allowExtensionKinds` is removed from
    the resolve-job request contract and no longer widens kind admission.
    WaveWorld's `waveworld-module` kind is validated automatically with the
    same full-spec module validator used by Host intake; unknown kinds remain
    rejected. Existing valid module jobs continue to resolve.
    Strict terminal outcome receipts (1.56.14): Agent claims include a 0-based
    `attempt`; complete/fail requests may include that exact attempt to bind a
    write to its lease. Legacy requests that omit it remain accepted and bind
    to the authenticated Agent's current lease. Agent adapters must not blindly
    retry terminal writes: after a lost acknowledgement or 409, GET
    `/api/v1/jobs/{id}/outcome?attempt=N` returns only an immutable receipt for
    that exact lease and authenticated Agent, or a uniform 404. Receipts capture
    success, failure, cancellation, retry/requeue, or lease expiry and are not
    replaced by later claims. This does not expose the current JobRecord to a
    prior or foreign Agent. [BREAKING CHANGE / CONTRACT IMPACT] W-Sim runtime,
    WaveWorld Agent and Host use the 0.3 terminal outcome contract together.
    AI4S module discovery (1.56.12): the public read-only descriptor at
    /.well-known/ai4s-module.json advertises the existing simulation jobs API.
    Discovery does not mint credentials, grant access or proxy calls; jobs retain
    the provider's W-ID-backed session, operator-key and Agent credential policy.
    IGBT spatial-chip producer/consumer contract (1.56.10): the existing
    electro-thermal-igbt kind uses the explicit mode=spatial-chip input and the
    native-cuda-only completion shape below. WaveWorld Agent uploads the full
    temperature field and exact KPI summary before cleanup; Host binds both
    artifacts to the leased job, owner and project and validates field bytes,
    digest metadata, grid/unit/CSV shape, method, ordered die IDs and finite
    global/per-die KPIs. Native admission remains responsible for physical-domain
    validation and convergence. The source tree includes the Agent, Host settlement,
    saved-result reader and result card; this description does not imply deployment.
    Other legacy IGBT modes and the JobSpecV1 kind/path/envelope remain unchanged.
    [CONTRACT IMPACT] W-Sim producer, WaveWorld Agent and Host must be released
    together.
    IGBT spatial-chip JSON float64 compatibility (1.56.11): native consumers
    must round-trip JSON numeric values through IEEE-754 binary64 before
    normalized-summary and digest generation. Long decimal coordinate tails can
    therefore round differently, so summaries, digests and derived artifact IDs
    can differ when those inputs are recomputed. Previously saved field/KPI
    artifacts remain readable from their stored bytes and IDs; they are not
    rewritten or re-hashed. HTTP paths, request/response envelopes and artifact
    endpoints are unchanged.
    Thermal steady material regions (1.56.8): the steady parameter contract now
    describes materials/regions, bounded conductivity overrides and additive
    volumetric/power sources. Matching TS/native regional producers passed the
    bounded independent OBS-003 checks retained in W-Sim PR113. Schema acceptance
    alone does not establish general engineering validity or a deployed matching release.
    Thermal steady field delivery (1.56.7): new explicit dimension=3
    thermal-3d-steady completion requires exactly two saved Host-owned artifacts:
    thermal-temperature-field (application/octet-stream, float64 little-endian,
    x-fastest) and thermal-kpi-summary (application/json equal to result.summary).
    The Agent validates local files and upload acknowledgements before cleanup,
    replaces local artifact references with Host IDs, and propagates delivery
    failure. Host binds files to job/owner/project, checks bytes/SHA, grid, C/K
    units, finite field/extrema and summary inputDigest shape. With at most256
    cells, decimal CSV must equal the saved f64 values (signed zero equivalent);
    larger fields forbid inline CSV. Invalid completion returns400 without
    settling, allowing corrected retries. Historical1D/2D descriptors remain
    readable. Result readers can download and export field/KPI/spec/result/manifest.
    This 1.56.7 artifact change introduced no route/envelope, material-region
    request fields or browser thermal executor. [CONTRACT IMPACT] Update native producers, Agent, Host and readers
    together; descriptor-only3D steady completion does not meet this contract.
    Thermal steady boundary heat (1.56.6): for thermal-3d-steady, smooth interior
    nodes of 3D Dirichlet faces now use discrete PDE-curvature heat with a four-point
    normal stencil and symmetric Simpson tangential weights. Nodes where Dirichlet
    faces intersect retain the prior face-gradient treatment and are excluded from
    face heat. Other boundary kinds and legacy 1D/2D calculations are unchanged.
    Request shape, temperature fields, input digests, method ID, heat units and the
    energy definition remain unchanged. On the retained GPU fields, probe closure
    errors were 12.8993%/4.54737%/1.49245% across 5³/9³/17³ grids; worst per-face
    errors were 14.4936%/4.73557%/1.60012%, with minimum refinement ratio 2.28529
    passing its gate. These were initial old-field probes; fresh native/TS producer
    and per-face acceptance subsequently passed in W-Sim PR111. [CONTRACT IMPACT]
    Recompute old3D heat KPIs. Coordinated production release remains pending.
    Thermal steady contract (1.56.5): the existing backend jobs route documents
    the native thermal-3d-steady input shape, including explicit 1D/2D/3D
    dimensions, geometry, uniform material/source, SI units and face boundaries.
    The steady schema accepts JSON numbers only (no transient value wrappers or
    nullable numeric aliases). Domain admission, temperature anchors, corner
    conflicts and additional native rules are checked by the solver at execution;
    publishing this schema does not certify 3D fields, Host artifacts, Agent or UI.
    At 1.56.5, the steady solver was limited to uniform conductivity/source and
    did not apply material-region inputs. 3D normalized input includes lengthZ and nz while
    existing 1D/2D normalized input and its digest remain unchanged. Consumers
    (native solver, TypeScript runner, API clients and Agent) must coordinate the
    matching contract version before release.
    Thermal transient contract (1.56.4): the existing backend jobs route documents
    native transient material, initial-field, probe and time controls and aliases.
    The shared TypeScript contract models canonical scalar inputs; raw native numeric
    aliases may also accept value envelopes as documented below. This adds no new
    HTTP input fields or browser thermal executor. Generic Host intake still checks
    the envelope; native solver-domain admission occurs during Agent execution.
    New transient completion with at most 256 cells requires temperatureCsv with
    exactly one finite decimal/exponent token per x-fastest field cell, numerically
    equal to the saved binary64 value (positive and negative zero compare equal).
    Missing, malformed or mismatched inline data returns 400 before settlement;
    the active executor may retry a corrected result. Larger fields forbid inline
    CSV, and historical completed records remain readable. Update producers and
    Host together; native writer/Agent/Host artifact version requirements still apply.
    Thermal node-domain admission (1.56.3): solver validators reject intersecting
    Dirichlet faces with different temperatures using boundary_conflict. Opposite
    faces may differ, and Dirichlet intersections with other boundary kinds retain
    their existing rules. Native transient material regions ignore inactive axes;
    region powerW is distributed over the selected nodes' dual volumes, and an
    empty selected power region fails with invalid_source. Regional source densities
    and overlapping powers add; later material properties override supplied fields.
    Generic Host task intake checks the envelope, so domain errors can be reported
    during Agent execution. Method IDs and HTTP/input envelopes are unchanged;
    recompute historical results affected by source normalization or inactive axes.
    Native transient field integrity (1.56.2): new thermal-3d-transient completion
    requires real uploaded little-endian f64 field and exact history artifacts,
    validated against job ownership, metadata, SHA, dimensions and saved values.
    Descriptor-only completion fails closed; historical completed rows stay readable.
    mac-3d adds constant-density, stationary-geometry, SI laminar Navier-Stokes tasks
    through the same JobSpecV1 envelope, leases, instance lifecycle and artifact API.
    Native Rust and browser/resident WASM execute the same FP64 MAC kernels: supplied
    fan P-Q curves are sampled at step start, momentum advances with physical viscosity,
    pressure projection enforces the absolute divergence bound, and optional conjugate
    heat uses the projected face velocities. Only after all stages succeed is the step
    committed. No automatic viscosity or macroscopic timestep adjustment is performed.
    New MAC tasks require CPU/float64 and mac-3d-v1; Host normalizes the feature before
    fingerprinting or reuse lookup. Old LBM results remain readable and cannot satisfy it.
    Current shared voxelization rejects invalid solid boundary edges (code 11) for both
    MAC and LBM preparation. Task DTOs and WGM1/WGM2 layouts are unchanged. Update pinned
    W-Sim, Host, Lab and resident Agents and rebuild/redeploy the native image together;
    old native Agents must be upgraded, since existing capability names do not identify
    this stricter admission. Historical saved results remain readable.
    MAC begins at rest with solid/fluid thermal energy at ambient. Open faces prescribe
    ambient gauge pressure at the half-cell boundary, with zero tangential backflow donor,
    ambient thermal inflow and zero external conduction; other domain faces are stationary
    no-slip walls and thermally insulated. Internal solid surfaces use no-slip. Optional
    fixed-temperature surfaces or powered materials/contact resistance use existing thermal
    inputs. Buoyancy, moving geometry, prescribed wind inlet, ground motion, turbulence,
    rotor blades and aerodynamic Cd/Cl or integrated body drag/lift are not implemented.
    Resolved fan circle/obstruction/overlap admission runs in the shared executor kernel;
    an invalid fan terminates the task and follows the existing instance-stop lifecycle.
    First-order donor-cell dissipation and grid resolution still limit physical accuracy;
    a satisfied pressure constraint is not an engineering or mesh convergence certificate.
    mac-flow-field WVM1 stores SI velocity/pressure and optional absolute Celsius; it never
    uses the older WVF1 lattice normalization. Saved field frames are replayed without solving.
    Product extensions of the existing W-Sim JobSpecV1 jobs API: waveworld-module
    and exact-mesh/sampled-display artifact transport for lbm-d3q19. Other builtin jobs remain supported.
    All new LBM jobs require lbm-gauge-force-v1, lbm-nee-outlet-v1, lbm-nee-inlet-v1 and lbm-mass-balance-v1. Host adds these requirements before
    fingerprinting or prior-result lookup; existing stored jobs are never rewritten.
    New native/WASM/WebGPU results report derived[lbm-gauge-force-v1]=1. Model-link
    momentum exchange uses 2*(f_q-f_ref_q)*c_q with fixed lattice rho_ref=1 and
    f_ref_q equal to the FP32 rest-equilibrium weight. This removes the uniform
    reference-pressure load on an unclosed wetted surface (including wall contact).
    It does not subtract the moving-inlet equilibrium, change distribution transport,
    include ground reaction, or establish converged aerodynamic coefficients.
    Force sampling and physical Newton/coefficient conversions are unchanged.
    The xMax fluid pressure outlet now uses current streamed interior distributions:
    f_out_q = feq_q(1,u_inner) + f_inner_q - feq_q(rho_inner,u_inner), for all 19 populations.
    rho_inner and u_inner are reconstructed from that inner cell's current distributions;
    velocity uses bare momentum divided by density, without a half-step body-force addition.
    The xMin velocity inlet uses the same current streamed inner fluid node at x=1:
    f_in_q = feq_q(rho_inner,u_prescribed) + f_inner_q - feq_q(rho_inner,u_inner).
    The prescribed inlet velocity retains its deterministic per-cell, per-step noise.
    This replaces the equilibrium-only inlet and its known-population density reconstruction.
    Both open boundaries reject a solid inner neighbor without fallback. The inlet
    preserves the neighbor's non-equilibrium moments; boundary reconstruction can exchange
    mass with the exterior and does not establish global mass conservation by itself.
    This is a current-stream whole-node NEE adaptation for weakly compressible D3Q19;
    it does not establish the original unforced D2Q9 paper's convergence order for this solver.
    Fan forcing cannot occupy the outer inlet layer. Thermal inlet cells remain at ambient,
    with the existing thermal boundary-energy account; neighboring body forces are excluded
    when reconstructing bare moments. Side-wall, ground and outlet formulas are unchanged.
    New executors advertise lbm-nee-inlet-v1 and report derived[lbm-nee-inlet-v1]=1.
    New executors advertise lbm-nee-outlet-v1 and report derived[lbm-nee-outlet-v1]=1;
    old results stay readable but cannot be reused for newly normalized requests.
    ABI 11 is mandatory for the shared WASM kernel and the D3Q19 configuration;
    the configuration remains 1888 bytes. Statistics grow from 96 to 152 bytes:
    the original 12 f64 slots stay unchanged, followed by seven f64 values in order:
    bulk_mass_before, bulk_mass_after, inlet_net_mass, outlet_net_mass,
    collision_mass_change, inlet_replacement_mass, outlet_replacement_mass.
    New executors advertise lbm-mass-balance-v1 and return its derived marker plus
    lbmMassBalance. Host includes the optional report in settlement fingerprints;
    old saved rows and identical successful retries remain immutable and readable.
    New product LBM settlement binds derived.dx/dt to preparation using the submitted
    model.referenceLength or owned artifact geometry. Other model sources must provide
    referenceLength. Kilogram quantities originate in the executor; Host consistency
    checks do not independently prove their physical validity from saved scalar frames.
    Native and WASM retain identical scientific fields. WebGPU uses FP32 reductions;
    consistency tolerances account for precision and steps, not an engineering error bound.
    LBM outputs.fields containing pressure additionally requires lbm-pressure-field-v1;
    Host records this conditional requirement before fingerprinting and prior-result lookup.
    Pressure requests save WVF2 with derived[lbm-pressure-field-v1]=1 and finite positive
    derived.pressureScalePa = submitted fluidDensity * (prepared dx / prepared dt)^2.
    The appended lattice channel is sum_q(f_q - f32(w_q))/3 at the saved completed step;
    physical gauge pressure in Pa equals that channel times the saved pressureScalePa.
    Its fixed reference is the discrete FP32 rest-equilibrium populations, matching
    the gauge-force reference; those exact populations give zero pressure. This is
    mechanical gauge pressure, not atmospheric absolute pressure or dynamic pressure.
    Solid pressure slots are zero and have no fluid meaning.
    Host binds the scale to submitted density and prepared units, but cannot independently
    prove the pressure populations from display samples or infer surface loads from them.
    WVF1 and old IndexedDB objects remain readable with pressure unavailable, never zero.
    Only pressure requests upgrade to WVF2; MAC WVM1 and its SI pressure remain unchanged.
    ABI 11 adds the populations pointer to d3q19_display immediately before display;
    zero means the unchanged old 2/3-channel display, nonzero requests appended pressure.
    Historical results without lbm-gauge-force-v1 remain readable as raw momentum-exchange
    results; an identical completed-result retry is idempotent, never relabeled.
    Settlement fingerprints include the complete thermal energy account; changing it
    on a completed-result retry returns 409, as for other scientific output changes.
    Faraday induction now shares FP64 Rust for Lenz/motional/rotating-coil helpers,
    discrete flux differentiation, and both 361-point curves over two periods.
    Native and browser/Node WASM Agents preserve the existing scene/result JSON and
    run.maxSteps=1. Playback selects a saved curve position without recomputation.
    The browser reuses caller-owned buffers; missing WASM leaves backend controls and
    saved results usable. Nonfinite/overflowing helpers and nonpositive series dt fail explicitly.
    These are uniform-field analytic induction models, not a full electromagnetic device solver.
    Signal-array adds a single FP64 static calibrated spatial snapshot to native and
    browser/Node WASM Agents. Sensor response v=Sx+b, normalized Hadamard/direct/custom
    coding y=Cv+seeded uniform noise, and column-pivoted Householder QR share one Rust core.
    Unregularized rank-deficient systems retain measurements but return null reconstruction
    and errors. Ridge uses an augmented QR and reports the original operator rank; a
    numerically rank-deficient augmented system fails instead of returning an unreliable estimate.
    Optional signal-array readout adds a shared RC node scanned in code-row order.
    Spatial input is held for the whole scan. With tau=R*C and q=1-exp(-dwell/tau),
    each sampled voltage is (1-q)*previousSample+q*idealVoltage; the initial sample is initialV.
    Seeded noise is added after sampling and does not feed back into the RC state.
    Decoding, rank and ridge use the actual causal sampled operator and known initial/bias offset.
    New results include idealV, sampledV, settlingFraction and readoutTauS. Old ideal-readout
    results without these fields remain replayable; RC jobs require all four fields.
    This is calibrated linear sensing with a single-pole readout, not flexible mechanics,
    a multi-node circuit solver, ADC quantization, switching injection, amplifier saturation or EIT.
    RC charge/discharge and RL current snapshots also share one FP64 Rust core across
    native and browser/Node WASM Agents. Their existing 241-sample 0..5*tau result contract
    and run.maxSteps=1 remain unchanged; playback moves a cursor over the saved curve.
    Radar, laser and NLJD now share Rust cores across native and browser/Node WASM Agents.
    Radar advances a scalar teaching wave with FP32 field storage and FP64 arithmetic
    (mixed precision); source injection, fixed obstacles, two-step sampling including the
    final odd step, four 256-sample trace rings and readouts are owned by the core.
    Laser uses FP64 Euler rate-equation steps and analytic equilibrium curves; NLJD uses
    the FP64 preset cubic junction model. These are not full Maxwell, laser-device or
    measured-material solvers. Existing scene/result JSON and 1–2000 iterative step limits
    remain unchanged. Native/browser Agent admission expands; previous exports remain valid.
    Saved results can be replayed with local WASM unavailable, including parameter controls.
    Antennapattern, antenna3d and phasedarray now compile one FP64 Rust implementation
    for native, browser and Node WASM Agents. The old JavaScript numerical paths are removed.
    Existing parameter/result JSON, fixed sample counts and run.maxSteps=1 are unchanged.
    W-Sim owns field/power patterns, directivity, fixed-step half-power-width scans, Friis
    budgets, polarization loss, full element-phasor summation and sorted grating lobes.
    Ideal antenna nulls remain prDbm=null; visible-interval array beamwidth clipping is retained.
    Nonfinite or invalid values and overflowing intermediate calculations fail explicitly.
    Page owners reuse WASM buffers across edits; saved snapshots use returned results without
    local recomputation. Playback affects illustrative markers/wavefronts only. Controls and
    backend snapshot rendering remain usable when local WASM is unavailable.
    ABI 11 includes antenna/array exports, retaining their layouts.
    These remain ideal far-field and uniform-array models; antenna coupling, near-field and
    lossy-structure Maxwell solving are not added by this migration.
    Optics traces compile one Rust implementation natively and in browser/Node WASM Agents.
    Electromagnetic, sound and emwave3d snapshots now use the same FP64 Rust core in
    native, browser WASM and Node WASM execution, with persistent caller-owned buffers.
    The former JavaScript field/observable formulas are removed. Input/output JSON and
    run.maxSteps=1 are unchanged; valid frequency/time/position ranges are preserved.
    Nonfinite parameters, sample positions, derived fields and phase overflow fail explicitly.
    Acoustic intensity validation accepts up to 5e23 W/m² as implied by the existing input limits.
    Large phases use shared deterministic range reduction; native/WASM numeric outputs match.
    Animated plane-wave pages capture the displayed time when submitting a job, stop local
    computation while a snapshot is active, and display the saved result. Editing parameters
    invalidates it. Missing WASM leaves controls and backend snapshot rendering available.
    ABI 11 includes plane-wave exports, retaining their layouts.
    Optics and plane-wave jobs use CPU FP64, one snapshot per job.
    Optics preserves reflection/refraction/TIR, thin lens, Malus polarization, split rays,
    losses, LIFO processing and first-hit screen profile order. Persistent caller-owned
    buffers advance in bounded ray batches while run.maxSteps remains 1.
    Existing OpticsComponent/trace JSON and the inline compute-file envelope are unchanged.
    Screen profiles must be unique and match the screenPower keys exactly.
    Product limits remain 64 components, 28 bounces, 48 screen bins and at most 20000 processed rays.
    Exceeding that ray limit fails explicitly; a truncated trace is never a successful result.
    The old JavaScript tracer and numerical geometry are removed. SVG transforms draw the editor
    without invoking a solver, so backend results and editing remain available without local WASM.
    Geometry/reference arithmetic can differ in last bits from the old JavaScript implementation,
    including adjacent display rounding at decimal ties. Native and WASM share the exact numeric outputs.
    ABI 11 includes optics exports and error status 8 for the ray limit; their layouts/statuses are retained.
    Release W-Sim, Atlas, Host, resident Agents and the native image together.
    This is the existing 2D geometrical-ray model, with fixed teaching losses and a thin-lens approximation;
    it does not implement diffraction/interference, Fresnel coefficients or arbitrary 3D optical materials.
    2D TMz FDTD uses the same Rust core in native and browser WASM Agents, with FP64 arithmetic and FP32 fields (mixed).
    FDTD preserves the existing presets, source timelines and Mur/PEC conditions; the old JS field stepping is removed.
    Unstable CFL coefficients and invalid material/field values fail explicitly.
    The 2D homogeneous Lennard-Jones MD scene uses shared Rust native/WASM force, Verlet,
    temperature/pressure control, RDF and diffusion analysis with FP32 particle buffers and FP64 arithmetic.
    MD retains fixed 1-4 step batches; deterministic roots replace JS Math.pow in baths and may change final rounding.
    Exactly overlapping LJ particles fail explicitly. Native MD requires the persisted ComputeMdInput
    under optional md in the offline ComputeJobFile; no credential or separate input artifact is passed.
    User-defined particles reuse that Rust core and envelope with optional md.particles properties:
    explicit species order, charge, sigma, epsilon and screened-Coulomb coefficients.
    Native and WASM share mixed-precision force, integration, readout and RDF; material names remain metadata.
    The old JS heterogeneous force/integration path is removed. WebGPU preview remains separate FP32 WGSL.
    The fluid and convection modules share the Rust 2D Stable Fluids core in native and browser WASM.
    Existing scene/result shapes, grid sizes and boundary approximations are unchanged.
    Projection, diffusion, advection, buoyancy, obstacle clearing, source/decay and readout
    run in Rust with FP64 arithmetic and FP32 fields. UI and Node retain input/transport glue.
    These reduced 2D examples remain distinct from the stationary 3D LBM flow/heat solver.
    Ising uses the same Rust native/WASM kernel for seeded Mulberry32 initialization,
    periodic random-site Metropolis sweeps, moments, readout and Onsager/Yang reference.
    Exact i8 spins and u32 RNG state are retained in owned buffers; arithmetic and statistics
    use FP64 (precision=float64). Temperature scheduling reuses the existing inline scene.
    Reference evaluation uses deterministic Rust arithmetic and may differ in last bits
    from the previous JavaScript reference; the replaced JS numerical path is removed.
    RLC, mutual inductance, forced vibration and FitzHugh-Nagumo neuron scenes use
    the same FP64 Rust ODE kernels in native and owning-browser WASM execution.
    RK4 stages, mutual substeps and dissipation, oscillator resonance, neuron Euler
    updates, pulse scheduling and spike detection share the core; old JS solver paths are removed.
    Each run owns persistent state and trajectory buffers. Existing inline scenes,
    result shapes, pulse/step limits and job/file envelopes are unchanged.
    ODE exports require ABI 11; the shared loader requires them, so update W-Sim,
    Atlas, Host, resident Agents and the native image together.
    Deterministic trigonometry may change last-bit rounding from old JS results.
    Its absolute phase limit is 262144 radians; existing product ranges stay within it.
    Invalid low-level oscillator inputs fail explicitly instead of returning NaN or a no-op.
    LBM with fixed model geometry uses one Rust core natively or in browser WASM (CPU mixed precision).
    Optional ground defines a stationary or freestream-moving no-slip bottom wall. Model placement,
    attached fan and thermal regions share the same clearance transform. Ground is adiabatic;
    viscous heating and rotating wheels are not included. Ground jobs require lbm-ground-v1.
    The same Rust core supports one constant-pressure fan actuator disk.
    Optional conservative heat transport couples fluid advection and conduction to solid materials.
    Solid-power optionally accepts thermalContacts between material indices 0..16 with
    area-normalized resistance in m²·K/W. Zero retains ideal contact; configured pairs must
    share an actual voxel face. Native and WASM use the same Rust core (ABI 11); WebGPU uses FP32.
    Agent capabilities.features must include lbm-thermal-regions-v1 / lbm-thermal-contacts-v1
    when the corresponding parameter array is nonempty, even when requirements.features is omitted.
    Solid-power accepts up to 16 named thermalRegions, each selecting existing solid cells by
    normalized original-model bounds and assigning its own material and total heat-generation power.
    Region assignment runs in shared Rust/WASM and follows model rotation. No additional geometry is created.
    Solid faces use harmonic material conductance, with optional resistance on configured contacts.
    Fixed-temperature and solid-power use the same Rust heat-flux algorithm with Boussinesq buoyancy.
    This replaces D3Q7 and changes previous thermal results; ABI 11 requires coordinated W-Sim/Host/Lab/native-image updates.
    WebGPU uses the same discrete heat-transfer equations in FP32 with tolerance-based validation;
    this is a WGSL backend, not a bit-identical compilation of the Rust source or an FP64 GPU solver.
    Thermal jobs require explicit CPU/mixed or WebGPU/float32 execution and an Agent advertising thermal=true.
    Radiation is not implemented.
    Thermal runs retain physical viscosity and dt, require tau >= 0.505 and bounded low-Mach velocity and thermal substeps.
    Large/coarse air models may have no admissible dt; a finite output is not engineering validation.
    Thermal JobResult.derived includes ambientC, temperatureScaleC (>0) and thermalDiffusivityPhysical (m2/s).
    LBM JobResult.summary.sideN optionally reports signed z-axis force in newtons over the same sample window as dragN/liftN.
    Missing sideN means not computed, never zero.
    WVF1 stride 3 stores normalized temperature theta; Celsius = ambientC + theta * temperatureScaleC.
    Replay must use the saved result scale, not current page input.
    This contract does not claim engineering validation or a full Maxwell solver.
    Unknown response fields must be tolerated. Authentication and job ownership
    use the existing Host policy; registration of this kind grants no new access.
security:
  - userBearer: []
  - userSession: []
paths:
  /.well-known/ai4s-module.json:
    get:
      operationId: getWaveWorldModuleDescriptor
      summary: Discover WaveWorld's simulation jobs API and interactive workspace
      description: >-
        Public, read-only module descriptor. It advertises the existing
        /api/v1/jobs endpoint and links to the existing /app/lab/lab workspace.
        The workspace link uses WaveWorld's provider session and grants no
        AI4S-mediated access. Job access still uses the provider's W-ID-backed
        user session or the existing operator/Agent credential flow; discovery
        grants no access and does not proxy or mint credentials.
      responses:
        '200':
          description: WaveWorld module and capability descriptor.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, moduleId, version, capabilities]
                properties:
                  schemaVersion: { const: ai4s-module/1 }
                  moduleId: { const: waveworld }
                  version: { const: 2.0.0 }
                  capabilities:
                    type: array
                    items:
                      oneOf:
                        - type: object
                          required: [id, contract, transport, path, mode, authentication]
                          properties:
                            id: { const: simulation.jobs }
                            contract: { const: waveworld-jobs/1 }
                            transport: { const: http }
                            path: { const: /api/v1/jobs }
                            mode: { const: numerical }
                            authentication: { const: provider-session }
                        - type: object
                          required: [id, contract, transport, path, authentication]
                          properties:
                            id: { const: simulation.workspace }
                            contract: { const: waveworld-workspace/1 }
                            transport: { const: link }
                            path: { const: /app/lab/lab }
                            authentication: { const: provider-session }
  /api/v1/jobs:
    post:
      operationId: submitWaveWorldModule
      description: |
        execution=browser requires an authenticated user and currently admits only
        ripple, sim, fdtd, md, particles, fluid, convection, ising, rlc, mutual,
        vibration, neuron, optics-lab, electromagnetic, sound, emwave3d, antennapattern,
        antenna3d, phasedarray, radar, laser, nljd, signal-array, transient, faraday and stationary artifact-model lbm-d3q19 or mac-3d jobs.
        MAC supports only backends=[cpu], precision=float64 through shared Rust/WASM.
        LBM supports backends=[cpu], precision=mixed through Rust/WASM, or
        backends=[webgpu-browser] (or [webgpu]), precision=float32 through WebGPU.
        LBM returns velocity/vorticity fields
        with optional temperature when thermalEnabled=true. It atomically creates and leases the job
        to a new browser-UUID agentId, without allocating W-Compute resources or
        issuing a server Agent token. Keep the returned agentId for heartbeat,
        complete and fail. Browser execution does not reuse prior results.
        Closing a tab stops its Worker; an expired lease returns through the
        existing queue retry policy. Old tabs cannot publish after reassignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              allOf:
                - if:
                    required: [execution]
                    properties: { execution: { const: browser } }
                  then:
                    properties:
                      spec:
                        not:
                          required: [kind]
                          properties: { kind: { const: thermal-3d-transient } }
              properties:
                execution: { const: browser, description: Omit for ordinary backend dispatch; native thermal transient jobs cannot use browser execution. }
                spec:
                  oneOf:
                    - { $ref: '#/components/schemas/ModuleJobSpec' }
                    - { $ref: '#/components/schemas/LbmMeshJobSpec' }
                    - { $ref: '#/components/schemas/MacJobSpec' }
                    - { $ref: '#/components/schemas/StructuralJobSpec' }
                    - { $ref: '#/components/schemas/ThermalSteadyJobSpec' }
                    - { $ref: '#/components/schemas/ThermalTransientJobSpec' }
                    - { $ref: '#/components/schemas/IgbtJobSpec' }
      responses:
        '201':
          description: Queued backend job or already leased browser job; save its id to poll or cancel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400': { description: Invalid input or model artifact; run.maxSteps must match the selected module workload. }
        '401': { description: Authentication required. }
        '403': { description: Access denied by existing job ownership policy. }
  /api/v1/jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getWaveWorldModuleJob
      responses:
        '200':
          description: Existing job record; a succeeded job includes its persisted result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '404': { description: Job not found or inaccessible. }
  /api/v1/jobs/{id}/outcome:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: attempt
        in: query
        required: true
        description: The 0-based attempt returned by this Agent's claim response.
        schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
    get:
      operationId: getSimulationAgentAttemptOutcome
      description: Requires an authenticated Agent. Returns only the immutable outcome receipt for the exact job/attempt if this Agent held that lease. Missing, foreign, unclaimed and legacy attempts without a recorded receipt all return the same 404. This endpoint never returns the current JobRecord or another attempt's state.
      responses:
        '200':
          description: Immutable terminal receipt captured for this exact Agent lease attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAttemptOutcomeResponse' }
        '404': { description: Receipt not found or not owned by this Agent. }
        '429': { description: Agent job-read rate limit exceeded. }
  /api/v1/jobs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelWaveWorldModuleJob
      responses:
        '200': { description: Existing cancellation acknowledgement; terminal jobs retain their status. }
        '404': { description: Job not found or inaccessible. }
  /api/v1/jobs/{id}/heartbeat:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/BrowserAgent' }
    post:
      operationId: heartbeatSimulationExecutor
      description: Existing Agent API also accepts the owning user's session plus X-Browser-Agent. Lease and status checks remain authoritative.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { progress: { type: object } } }
      responses:
        '200': { description: Running job with renewed lease. }
        '401': { description: Executor authentication required. }
        '403': { description: Browser is not the owning user/tab. }
        '409': { description: Lease lost or job is terminal. }
  /api/v1/jobs/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/BrowserAgent' }
    post:
      operationId: completeSimulationExecutor
      description: Existing Agent API also accepts a browser job's owning session and tab. Result validation and idempotent settlement use the same Host implementation. Native thermal-3d-transient completion requires saved thermal-temperature-field and thermal-history artifacts owned by this job, user and project; their size, SHA-256, grid, units, extrema and history are validated before settlement. At most 256 cells also require finite decimal temperatureCsv values in exact field order, numerically equal to the stored f64 field; missing or inconsistent inline values return 400 without settling. For electro-thermal-igbt with mode=spatial-chip, completion requires exactly the native-cuda field and KPI artifact pair; Host validates ownership, bytes/SHA, submitted grid/units, inline CSV threshold, method/inputDigest shape, ordered die IDs, finite global/per-die KPIs and submitted convergence metrics. The KPI JSON must equal result.summary. Native solver admission remains responsible for physical domain and loss-table matching. Descriptor-only results are rejected with 400; historical completed results remain readable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: object }
                attempt: { type: integer, minimum: 0, maximum: 9007199254740991, description: When present, must equal the exact 0-based attempt that claimed this lease. Omission is supported for legacy clients and binds to this Agent's current lease. }
      responses:
        '200':
          description: Persisted succeeded job including the stored result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400': { description: Result failed validation. }
        '401': { description: Executor authentication required. }
        '403': { description: Browser is not the owning user/tab. }
        '409': { description: Lease lost, cancelled, or conflicting settlement. }
  /api/v1/jobs/{id}/fail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/BrowserAgent' }
    post:
      operationId: failSimulationExecutor
      description: Existing Agent API also accepts the owning browser session/tab. Browser failures submit retryable=false; an unreachable Host instead relies on lease expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error: { type: string }
                retryable: { type: boolean }
                attempt: { type: integer, minimum: 0, maximum: 9007199254740991, description: When present, must equal the exact 0-based attempt that claimed this lease. Omission is supported for legacy clients and binds to this Agent's current lease. }
      responses:
        '200':
          description: Failure or retry recorded; response includes the authoritative current job state and stored error/result when terminal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '401': { description: Executor authentication required. }
        '403': { description: Browser is not the owning user/tab. }
        '409': { description: Lease lost or job is terminal. }
  /api/v1/artifacts:
    post:
      operationId: uploadSimulationArtifact
      description: |
        Upload the browser's currently loaded mesh before submitting an LBM job.
        The file is owned by the authenticated user. A job can reference only its
        submitter's personal artifact or a model in its explicitly authorized project.
        The Host validates the mesh, stores immutable bytes and computes SHA-256.
        ARTIFACT_MAX_BYTES limits uploads (default 32 MiB).
        Sampled and final lbm-display snapshots may be uploaded only by the currently leasing
        job agent with X-Job-Id. An owning browser user/session also supplies
        X-Browser-Agent. They inherit the job's user/project ownership.
      parameters:
        - { $ref: '#/components/parameters/BrowserAgent' }
        - name: X-Artifact-Kind
          in: header
          required: true
          schema: { enum: [model-geometry, lbm-display, mac-flow-field] }
        - name: X-Job-Id
          in: header
          description: Required for lbm-display or mac-flow-field; the agent must hold an unexpired lease.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/vnd.waveworld.mesh-v2:
            schema:
              type: string
              format: binary
              description: |
                WGM2 is the current writer format. 20-byte little-endian header:
                uint32 magic 0x324d4757, vertex-component count, normal-component
                count, triangle-index count, solid-group count. Payload arrays in
                that order: float32 xyz vertices, float32 normals, uint32 indices,
                uint32 solidTriangleCounts. Each group count is a positive number
                of consecutive triangles, and the sum must equal indexCount / 3.
                A zero-length group array means one boundary set. Within each group
                the voxelizer uses even-odd filling (so nested shells can retain
                cavities); between explicitly declared solids it takes the union.
                Neither connected surfaces nor material names imply a solid group.
                At computation preparation, each declared group (or the whole mesh
                without groups) must pair each nonzero-area triangle edge exactly twice
                in opposite directions, using exact vertex coordinates. Empty or wholly
                degenerate boundaries, open/non-manifold edges and inconsistent winding
                fail with code 11 before voxel flags are written. Individual zero-area
                triangles are skipped; no welding or hole repair is performed. This is
                not a self-intersection, vertex-manifoldness or enclosed-volume check.
                Binary upload/import alone does not certify admission to computation.
                Payload at most 80 MiB, plus the 20-byte header; configured artifact
                limits may be lower. Exact length, finite coordinates and in-range
                indices are required. Content-Type must match the header version.
                WGM1 saved models remain readable through the same validation and
                solver path, but cannot represent separate unioned solids.
          application/vnd.waveworld.mesh-v1:
            schema:
              type: string
              format: binary
              description: |
                WGM1 mesh: 16-byte little-endian header containing uint32 magic
                0x314d4757, vertex-component count, normal-component count and index
                count. Followed by float32 xyz vertex components, float32 xyz normal
                components, then uint32 triangle indices. Total byte count must match
                exactly. Counts are validated by the shared geometry contract, numbers
                must be finite, and every index must identify an existing vertex.
                This preserves the indexed mesh; no preset regeneration or simplification.
          application/vnd.waveworld.mac-field-v1:
            schema:
              type: string
              format: binary
              description: |
                WVM1, at most 33554432 bytes. 32-byte little-endian uint32 header:
                magic=0x314d5657, nx, ny, nz, step, stride=4 or 5, reserved=0, reserved=0.
                Followed by N interleaved float32 cell samples ux,uy,uz in m/s and gauge
                pressure in Pa, plus absolute temperature in Celsius for stride 5;
                then N uint32 material flags. Solver state remains FP64. Cell velocity
                averages its two component faces; pressure is cell-centered. Solid
                velocity/pressure slots are zero and must not be interpreted as fluid.
                Flags 0 fluid, 1 insulated solid, 2 hot reservoir, 3 ambient reservoir,
                4 default powered solid, 5..20 region materials. No NaN/Infinity,
                extra bytes, unknown flags or nonzero reserved words are accepted.
          application/vnd.waveworld.lbm-display-v2:
            schema:
              type: string
              format: binary
              description: |
                Pressure-requested WVF2, maximum 32 MiB, kind lbm-display.
                The same 32-byte little-endian header stores uint32 magic 0x32465657,
                nx, ny, nz, sampled step, stride (3 cold or 4 thermal), float32 uLattice,
                then uint32 channel bits: 1=temperature and 2=pressure. Pressure bit is
                required; only values 2 and 3 are accepted and must agree with stride.
                Followed by N interleaved float32 display samples then N uint32 flags.
                Speed and vorticity retain offsets 0/1 and lattice units; optional theta
                retains offset 2. Lattice gauge pressure is appended at offset 2 cold or
                3 thermal. Pa = pressure * saved derived.pressureScalePa. All samples
                must be finite; signed pressures are valid. Flags >1 require the explicit
                temperature bit, not stride 3. Solid pressure is a zero placeholder.
                Unknown channel bits, truncated/extra bytes and magic/MIME disagreement
                are rejected. All frames must match requested pressure and thermal mode.
          application/vnd.waveworld.lbm-display-v1:
            schema:
              type: string
              format: binary
              description: |
                WVF1 sampled or final frame, maximum 32 MiB. 32-byte little-endian header:
                uint32 magic 0x31465657, nx, ny, nz, actual sampled step, stride (2 or 3),
                float32 uLattice, then one reserved zero uint32 word. Followed by
                nx*ny*nz*stride float32 display components and nx*ny*nz uint32 flags,
                x-fastest cell order. Display components are lattice speed, lattice
                vorticity magnitude, and (stride 3) normalized temperature
                (T - saved derived.ambientC)/saved derived.temperatureScaleC.
                The scale is 1 kelvin in solid-power mode, including multi-material regions.
                Flags 0=fluid, 1=adiabatic solid, 2=fixed hot surface, 3=ambient reservoir,
                4=default conducting solid, 5..20=thermalRegions in submission order.
                Region flags require stride 3. Unknown flags are rejected.
                Reuses the solver visualize output exactly. Counts must match the
                payload, dimensions/step must be positive, uLattice nonnegative, all floats finite.
                A zero reference velocity is valid for natural-convection solid-power jobs;
                color display uses the saved fluid peak while physical velocity units stay dx/dt.
      responses:
        '201':
          description: Persisted simulation artifact.
          content:
            application/json:
              schema:
                type: object
                required: [artifact]
                properties:
                  artifact:
                    type: object
                    required: [id, sha256, bytes, kind, contentType]
                    properties:
                      id: { type: string, format: uuid }
                      sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                      bytes: { type: integer, minimum: 16 }
                      kind: { enum: [model-geometry, lbm-display, mac-flow-field] }
                      contentType: { enum: [application/vnd.waveworld.mesh-v2, application/vnd.waveworld.mesh-v1, application/vnd.waveworld.lbm-display-v1, application/vnd.waveworld.lbm-display-v2, application/vnd.waveworld.mac-field-v1] }
        '400': { description: Invalid mesh, content type or artifact size limit exceeded. }
        '401': { description: Authentication required. }
        '403': { description: Missing job permission or active agent lease. }
  /api/v1/artifacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadSimulationArtifact
      description: |
        Agents use their existing Bearer token and jobId. Host verifies a current
        lease assigned to that agent and that job.spec.model.artifactId equals id.
        This grants access only to that input file. Existing user/project artifact
        permissions and output-artifact downloads remain supported separately.
        Agents verify the returned SHA-256 before parsing the mesh.
        Browsers download sampled display artifacts by result.artifacts[].artifactId
        under existing user/project ownership. Verify byte count and SHA-256 before
        decoding. Display step must equal result.summary.steps. Public routes stay
        same-origin; allowed development origins expose X-Artifact-SHA256 through CORS.
      parameters:
        - name: jobId
          in: query
          description: Required for an agent to download a referenced input model.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Verified immutable simulation bytes.
          headers:
            X-Artifact-SHA256: { schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
          content:
            application/vnd.waveworld.mesh-v2:
              schema: { type: string, format: binary }
            application/vnd.waveworld.mesh-v1:
              schema: { type: string, format: binary }
            application/vnd.waveworld.lbm-display-v1:
              schema: { type: string, format: binary }
            application/vnd.waveworld.lbm-display-v2:
              schema: { type: string, format: binary }
        '400': { description: Invalid artifact or job id. }
        '403': { description: Missing or expired lease, wrong agent, or file is not this job's input. }
        '404': { description: Artifact missing. }
        '409': { description: Stored bytes failed integrity verification. }
  /api/v1/knowledge/resolve-job:
    post:
      operationId: resolveJobFromKnowledge
      summary: Assemble and validate a JobSpec from a released knowledge pack
      description: |
        Host resolves a released pack and materials into a JobSpec-shaped
        response with provenance. `waveworld-module` requests use WaveWorld's
        trusted full-spec validator automatically. Callers cannot opt unknown
        kinds into acceptance; the removed `allowExtensionKinds` field has no
        admission effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, minLength: 1 }
                releaseId: { type: string }
                packClaimId: { type: string }
                packSubjectId: { type: string }
                materialClaimIds:
                  type: array
                  items: { type: string }
                refs:
                  type: object
                  properties:
                    packClaimId: { type: string }
                    packSubjectId: { type: string }
                    materialClaimIds:
                      type: array
                      items: { type: string }
                overrides:
                  type: object
                  properties:
                    parameters: { type: object, additionalProperties: true }
                    run:
                      type: object
                      properties:
                        maxSteps: { type: integer, minimum: 1 }
                    name: { type: string }
                    model: { type: object, additionalProperties: true }
                    outputs: { type: object, additionalProperties: true }
                validate: { type: boolean, default: true }
      responses:
        '200':
          description: Assembled JobSpec and source provenance.
          content:
            application/json:
              schema:
                type: object
                required: [source, jobSpec, provenance]
                properties:
                  source: { const: db }
                  jobSpec: { type: object, additionalProperties: true }
                  provenance: { type: object, additionalProperties: true }
        '400': { description: Invalid body or unsupported job kind/schema. }
        '404': { description: Knowledge pack or release not found. }
  /api/v1/publications/{publicId}/reviews:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List reviews visible to the authenticated publication owner or reviewer.
      security: [{ userSession: [] }, { userBearer: [] }]
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: Visible immutable review records. }
        '400': { description: Invalid publication ID or version. }
        '401': { description: Authentication required. }
    post:
      summary: Submit an OIDC-authenticated non-owner scientific review.
      description: >-
        Requires canonical WAVEWORLD_REVIEW_ISSUE_URL operator configuration.
        The legacy payload URL field is retained. Only the exact HTTPS origin,
        repository issue and optional numeric issuecomment fragment are trusted;
        userinfo, queries, alternate paths and noncanonical URLs are rejected.
        Existing identity, owner, semantic and tamper guards remain required.
      security: [{ userSession: [] }, { userBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                version:
                  type: [integer, string, 'null']
                  default: 1
                  description: >-
                    Existing normalization accepts a positive safe integer or a
                    string resolving to one. Omitted, null or empty values use1;
                    other values return400.
                payload:
                  type: object
                  required: [schema, status, reviewer, execution, positiveVerification, tamperExercise, answers, usability, giteaIssue46CommentUrl]
                  additionalProperties: true
                  properties:
                    schema: { const: waveworld.golden-case-independent-review/v1 }
                    status: { const: completed }
                    reviewer: { type: object, additionalProperties: true }
                    execution: { type: object, additionalProperties: true }
                    positiveVerification: { type: object, additionalProperties: true }
                    tamperExercise: { type: object, additionalProperties: true }
                    answers: { type: object, additionalProperties: true }
                    usability: { type: object, additionalProperties: true }
                    giteaIssue46CommentUrl:
                      type: string
                      format: uri
                      description: Legacy field; must match the explicitly configured issue source.
      responses:
        '201': { description: Immutable server-verified review record created. }
        '400': { description: Invalid request, evidence, URL source or fragment. }
        '401': { description: Authentication required. }
        '403': { description: OIDC identity or independent non-owner requirement not met. }
        '404': { description: Public publication not found. }
        '409': { description: Duplicate review or mismatching immutable/verification digest. }
        '413': { description: Request body exceeds one MiB. }
        '429': { description: Review submission rate limit exceeded. }
        '503': { description: WAVEWORLD_REVIEW_ISSUE_URL missing or invalid; submission fails closed. }
components:
  parameters:
    BrowserAgent:
      name: X-Browser-Agent
      in: header
      description: Required only with browser user authentication; exact agentId returned on browser submission. It is a lease identifier, not a credential or permission to claim other jobs. Ordinary server Agent Bearer authentication remains supported.
      schema: { type: string, pattern: '^browser-[0-9a-f-]{36}$' }
  securitySchemes:
    userBearer: { type: http, scheme: bearer }
    userSession: { type: apiKey, in: cookie, name: ww_session }
  schemas:
    ModuleId: { type: string, enum: [optics-lab, electromagnetic, sound, fdtd, emwave3d, antennapattern, antenna3d, laser, phasedarray, nljd, signal-array, radar, localization, tdoa, stm, afm, rlc, mutual, transient, faraday, smith, ecg, eeg, emg, neuron, ultrasound, biopipeline, sim, heaterfc, md, ising, vibration, ripple, convection, display, particles, fluid] }
    ThermalSteadyBoundary:
      type: object
      description: >-
        One native steady face. Dirichlet requires finite temperature; Neumann
        requires finite heatFlux; insulated accepts neither; Robin requires
        h/heatTransferCoeff >= 0 and a finite ambientTemp, tInf or temperature.
        Conflicting fields, absent temperature anchors and incompatible values
        are rejected during solver admission. Perpendicular Dirichlet faces that
        meet at an edge/corner must use the same temperature.
      additionalProperties: true
      oneOf:
        - type: object
          required: [type, temperature]
          properties:
            type: { const: dirichlet }
            temperature: { type: number }
          additionalProperties: true
        - type: object
          required: [type, heatFlux]
          properties:
            type: { const: neumann }
            heatFlux: { type: number }
          additionalProperties: true
        - type: object
          required: [type]
          properties:
            type: { const: insulated }
          additionalProperties: true
        - type: object
          required: [type]
          properties:
            type: { const: robin }
            h: { type: number, minimum: 0 }
            heatTransferCoeff: { type: number, minimum: 0 }
            ambientTemp: { type: number }
            tInf: { type: number }
            temperature: { type: number, description: Native fallback alias for Robin ambient temperature. }
          anyOf:
            - required: [h]
            - required: [heatTransferCoeff]
          additionalProperties: true
          description: Robin requires one coefficient key and one ambient-temperature key.
          allOf:
            - anyOf:
                - required: [ambientTemp]
                - required: [tInf]
                - required: [temperature]
    ThermalSteadyJobParameters:
      type: object
      description: >-
        Parameters for native W-Sim kind thermal-3d-steady. This wire schema
        documents inputs; the native/TypeScript solver performs domain admission.
        Numeric fields are JSON numbers only. Unknown extension fields are retained
        by the generic job envelope but do not imply solver support.
      additionalProperties: true
      required: [units]
      properties:
        dimension:
          type: integer
          enum: [1, 2, 3]
          default: 1
          description: >-
            Explicit dimension is supported. When omitted, existing 1D/2D inference
            applies; specify 3 explicitly when supplying Z fields. The default 1D grid
            has nx=32. Active 2D/3D grid counts default to 32; active 3D axes require
            2..128 nodes. Each supported axis is capped at 128. Native admission
            decides dimension-specific validity.
        lengthX: { type: number, exclusiveMinimum: 0, description: Positive metres when supplied; defaults to 1 m after the lengthM fallback. }
        lengthM: { type: number, exclusiveMinimum: 0, description: Legacy alias for lengthX. }
        lengthY: { type: number, exclusiveMinimum: 0, description: Active Y length in metres; defaults to 1 m in 2D/3D. }
        lengthZ: { type: number, exclusiveMinimum: 0, description: Active Z length in metres; defaults to 1 m in explicit 3D. }
        nx: { type: integer, minimum: 1, maximum: 128, default: 32, description: X grid count; active 3D axes require at least 2. }
        ny: { type: integer, minimum: 1, maximum: 128, default: 32, description: Active Y grid count; active 3D axes require at least 2. }
        nz: { type: integer, minimum: 2, maximum: 128, default: 32, description: 3D Z grid count. }
        gridN: { type: integer, minimum: 1, maximum: 128, description: Fallback grid count for active axes without explicit axis counts. }
        conductivity: { type: number, exclusiveMinimum: 0, description: Uniform thermal conductivity in W/(m·K). }
        k: { type: number, exclusiveMinimum: 0, description: Alias used when conductivity is absent. }
        thermalConductivity: { type: number, exclusiveMinimum: 0, description: Fallback alias for uniform conductivity. }
        volumetricHeatWPerM3: { type: number, description: Finite signed uniform volumetric heat source; takes precedence over powerW. }
        powerW: { type: number, minimum: 0, description: Finite nonnegative total-power fallback, divided by active domain volume. }
        units:
          type: object
          required: [length, temperature, conductivity, power, heatFlux]
          description: All five exact unit labels are mandatory for native steady admission.
          additionalProperties: true
          properties:
            length: { type: string, const: m }
            temperature: { type: string, enum: [C, K] }
            conductivity: { type: string, enum: ['W/(m·K)', 'W/(m.K)', 'W/m/K'] }
            power: { type: string, const: W }
            heatFlux: { type: string, enum: ['W/m^2', W/m2, 'W·m^-2'] }
        boundaries:
          anyOf:
            - { type: object }
            - { type: 'null' }
          description: >-
            Supply left/right for 1D; add bottom/top for 2D and 3D; add front/back
            for 3D (front is z=0, back is z=max). If omitted/null, a finite ambientTemp
            and heatSourceTemp pair (or tLeft/tRight aliases) creates left/right
            Dirichlet faces and insulates other active faces. Missing faces, conflicting
            fields, missing absolute-temperature anchor, and corner conflicts fail
            native admission.
          additionalProperties: true
          properties:
            left: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
            right: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
            bottom: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
            top: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
            front: { $ref: '#/components/schemas/ThermalSteadyBoundary', description: z=0 face; required for 3D. }
            back: { $ref: '#/components/schemas/ThermalSteadyBoundary', description: z=zmax face; required for 3D. }
        ambientTemp: { type: number, description: Legacy left Dirichlet fallback when boundaries is absent. }
        heatSourceTemp: { type: number, description: Legacy right Dirichlet fallback when boundaries is absent. }
        tLeft: { type: number, description: Fallback alias for ambientTemp. }
        tRight: { type: number, description: Fallback alias for heatSourceTemp. }
        residualTol: { type: number, exclusiveMinimum: 0, default: 1e-8 }
        maxIterations: { type: integer, minimum: 1, maximum: 50000, default: 20000 }
        materials:
          type: [array, 'null']
          maxItems: 64
          items: { $ref: '#/components/schemas/ThermalSteadyMaterialRegion' }
          description: Primary steady region list; when absent, native reads regions. Empty lists retain uniform behavior.
        regions:
          type: [array, 'null']
          maxItems: 64
          items: { $ref: '#/components/schemas/ThermalSteadyMaterialRegion' }
          description: Alias for materials when materials is omitted; a present null primary value does not fall through.
    ThermalSteadyMaterialRegion:
      type: object
      required: [bounds]
      description: >-
        Steady region bounds are three finite physical-coordinate triples;
        inactive axes are ignored. Later regions override supplied conductivity
        per field. Regional sources add to the base source and to overlapping
        regions. Choose powerW or volumetricHeatWPerM3, not both. powerW is
        normalized over selected nodes' dual volume. Density and specific-heat
        fields are transient-only and rejected for steady regions. The steady
        regional method is thermal-steady-fv-regions-v1; solver admission and
        numerical validation remain separate from this wire schema.
      additionalProperties: true
      properties:
        name: { type: string }
        bounds:
          type: object
          required: [min, max]
          additionalProperties: true
          properties:
            min: { type: array, minItems: 3, maxItems: 3, items: { type: number }, description: Three finite physical coordinates. }
            max: { type: array, minItems: 3, maxItems: 3, items: { type: number }, description: Three finite physical coordinates. }
        conductivity: { type: number, exclusiveMinimum: 0, description: Positive regional conductivity in W/(m·K). }
        k: { type: number, exclusiveMinimum: 0, description: Alias used when conductivity is absent. }
        thermalConductivity: { type: number, exclusiveMinimum: 0, description: Fallback alias for conductivity. }
        powerW: { type: number, minimum: 0, description: Finite nonnegative total power over selected nodes. Mutually exclusive with volumetricHeatWPerM3. }
        volumetricHeatWPerM3: { type: number, description: Finite signed regional volumetric source. Mutually exclusive with powerW. }
      not:
        anyOf:
          - { required: [powerW, volumetricHeatWPerM3] }
          - { required: [density] }
          - { required: [densityKgM3] }
          - { required: [rho] }
          - { required: [specificHeat] }
          - { required: [specificHeatJkgK] }
          - { required: [cp] }
    ThermalSteadyJobSpec:
      type: object
      description: JobSpecV1 envelope for native thermal-3d-steady. Browser availability is governed by the existing browser executor and is not changed here.
      required: [schemaVersion, kind, parameters, run, outputs]
      additionalProperties: true
      properties:
        schemaVersion: { const: 1 }
        kind: { const: thermal-3d-steady }
        name: { type: string }
        workspaceId: { type: string }
        parameters: { $ref: '#/components/schemas/ThermalSteadyJobParameters' }
        model: { type: object, additionalProperties: true }
        run:
          type: object
          required: [maxSteps]
          additionalProperties: true
          properties:
            maxSteps: { type: integer, minimum: 1, description: Existing JobSpecV1 execution budget. }
            warmupSteps: { type: integer, minimum: 0 }
            forceSampleEvery: { type: integer, minimum: 1 }
        outputs: { type: object, additionalProperties: true }
        requirements: { type: object, additionalProperties: true }
    IgbtJobParameters:
      type: object
      description: >-
        Existing electro-thermal-igbt legacy parameter bags remain accepted as
        before. When mode is explicitly spatial-chip, all fields in
        IgbtSpatialChipJobParameters are required; no other mode aliases this
        new input shape.
      additionalProperties: true
      properties:
        mode: { type: string, description: Only the exact spatial-chip value selects the new spatial contract. Legacy mode fields remain unchanged. }
      allOf:
        - if:
            required: [mode]
            properties:
              mode: { const: spatial-chip }
          then:
            $ref: '#/components/schemas/IgbtSpatialChipJobParameters'
    IgbtSpatialChipJobParameters:
      type: object
      description: >-
        Typed spatial-chip request shape for the existing electro-thermal-igbt
        kind. This schema does not claim Host admission, solver execution or
        result/artifact acceptance. Native solver admission enforces finite values,
        closed-node geometry, exact loss-table operating-point matching and
        coupling convergence. This is the canonical non-null request shape; the
        native admission parser skips null values on its known forbidden keys.
        Spatial-chip requires the canonical conductivity field and rejects
        top-level conductivity aliases. Schema acceptance does not
        certify the complete native admission domain.
      required: [mode, dimension, lengthX, lengthY, lengthZ, nx, ny, nz, conductivity, units, boundaries, caseFace, dies, coupling]
      additionalProperties: true
      properties:
        mode: { type: string, const: spatial-chip }
        dimension: { type: integer, const: 3 }
        lengthX: { type: number, exclusiveMinimum: 0, description: Positive X span in metres. }
        lengthY: { type: number, exclusiveMinimum: 0, description: Positive Y span in metres. }
        lengthZ: { type: number, exclusiveMinimum: 0, description: Positive Z span in metres. }
        nx: { type: integer, minimum: 2, maximum: 128 }
        ny: { type: integer, minimum: 2, maximum: 128 }
        nz: { type: integer, minimum: 2, maximum: 128 }
        conductivity: { type: number, exclusiveMinimum: 0, description: Positive base conductivity in W/(m·K). }
        units:
          type: object
          required: [length, temperature, conductivity, power, heatFlux]
          additionalProperties: true
          properties:
            length: { type: string, const: m }
            temperature: { type: string, enum: [C, K] }
            conductivity: { type: string, enum: ['W/(m·K)', 'W/(m.K)', 'W/m/K'] }
            power: { type: string, const: W }
            heatFlux: { type: string, enum: ['W/m^2', W/m2, 'W·m^-2'] }
        boundaries:
          type: object
          required: [left, right, bottom, top, front, back]
          additionalProperties: true
          description: All six 3D faces use the existing steady boundary shape.
          properties:
            left: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
            right: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
            bottom: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
            top: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
            front: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
            back: { $ref: '#/components/schemas/ThermalSteadyBoundary' }
        caseFace:
          type: string
          enum: [left, right, bottom, top, front, back]
          description: Selected case face must be Dirichlet or positive-h Robin after native admission.
        materials:
          type: array
          maxItems: 64
          items:
            type: object
            required: [name, bounds, conductivity]
            additionalProperties: false
            properties:
              name: { type: string }
              bounds:
                type: object
                required: [min, max]
                additionalProperties: true
                properties:
                  min: { type: array, minItems: 3, maxItems: 3, items: { type: number } }
                  max: { type: array, minItems: 3, maxItems: 3, items: { type: number } }
              conductivity: { type: number, exclusiveMinimum: 0 }
          description: >-
            Optional conductivity-only material overrides. Bounds are physical
            triples and use the native closed-node membership rule.
        dies:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: '#/components/schemas/IgbtSpatialDie' }
          description: Ordered dies; IDs are unique and selected node sets must not overlap.
        coupling: { $ref: '#/components/schemas/IgbtSpatialCoupling' }
        residualTol: { type: number, exclusiveMinimum: 0, default: 1e-12 }
        maxIterations: { type: integer, minimum: 1, maximum: 50000, default: 50000 }
      not:
        anyOf:
          - { required: [powerW] }
          - { required: [power] }
          - { required: [P] }
          - { required: [volumetricHeatWPerM3] }
          - { required: [heatSourceWPerM3] }
          - { required: [sourcePowerW] }
          - { required: [density] }
          - { required: [densityKgM3] }
          - { required: [rho] }
          - { required: [specificHeat] }
          - { required: [specificHeatJkgK] }
          - { required: [cp] }
          - { required: [initialTemp] }
          - { required: [initialTemperature] }
          - { required: [initialField] }
          - { required: [tInit] }
          - { required: [dt] }
          - { required: [dtSeconds] }
          - { required: [dtS] }
          - { required: [timeStepS] }
          - { required: [steps] }
          - { required: [timeSteps] }
          - { required: [durationS] }
          - { required: [duration] }
          - { required: [tEnd] }
          - { required: [timeEndS] }
          - { required: [ambientTemp] }
          - { required: [ambientTempC] }
          - { required: [Tamb] }
          - { required: [heatSourceTemp] }
          - { required: [tLeft] }
          - { required: [tRight] }
          - { required: [lengthM] }
          - { required: [pulseWidthS] }
          - { required: [pulseWidth] }
          - { required: [tw] }
          - { required: [periodS] }
          - { required: [pulsePeriodS] }
          - { required: [period] }
          - { required: [burstCount] }
          - { required: [nPulses] }
          - { required: [N] }
          - { required: [nSamples] }
          - { required: [nSteps] }
          - { required: [Rth] }
          - { required: [igbtMode] }
          - { required: [regions] }
          - { required: [dutyCycle] }
          - { required: [switchingFrequencyHz] }
          - { required: [currentA] }
          - { required: [voltageV] }
          - { required: [gateResistanceOnOhm] }
          - { required: [gateResistanceOffOhm] }
          - { required: [thermalEnabled] }
          - { required: [convectionH] }
          - { required: [fluidDensity] }
          - { required: [method] }
          - { required: [igbtPreset] }
          - { required: [cthJK] }
          - { required: [Cth] }
          - { required: [cth] }
          - { required: [rthJa] }
          - { required: [rthJaKPerW] }
          - { required: [RthJA] }
          - { required: [layers] }
          - { required: [layersJson] }
          - { required: [q] }
          - { required: [source] }
          - { required: [duty] }
          - { required: [D] }
          - { required: [rth] }
          - { required: [gridN] }
          - { required: [materialsJson] }
          - { required: [initialJunctionTempC] }
          - { required: [k] }
          - { required: [thermalConductivity] }
    IgbtSpatialElectricalOperatingPoint:
      type: object
      required: [currentA, voltageV, gateResistanceOnOhm, gateResistanceOffOhm, dutyCycle, switchingFrequencyHz]
      additionalProperties: true
      properties:
        currentA: { type: number, minimum: 0 }
        voltageV: { type: number, exclusiveMinimum: 0 }
        gateResistanceOnOhm: { type: number, minimum: 0 }
        gateResistanceOffOhm: { type: number, minimum: 0 }
        dutyCycle: { type: number, minimum: 0, maximum: 1 }
        switchingFrequencyHz: { type: number, minimum: 0, description: Completed on/off pairs per second; not a carrier frequency with an extra duty factor. }
      allOf:
        - if:
            properties:
              switchingFrequencyHz: { exclusiveMinimum: 0 }
          then:
            properties:
              dutyCycle: { exclusiveMinimum: 0, exclusiveMaximum: 1 }
    IgbtSpatialLossTable:
      type: object
      required: [operatingPoint, points]
      additionalProperties: true
      properties:
        operatingPoint:
          type: object
          required: [currentA, voltageV, gateResistanceOnOhm, gateResistanceOffOhm]
          additionalProperties: true
          properties:
            currentA: { type: number, minimum: 0 }
            voltageV: { type: number, exclusiveMinimum: 0 }
            gateResistanceOnOhm: { type: number, minimum: 0 }
            gateResistanceOffOhm: { type: number, minimum: 0 }
        points:
          type: array
          minItems: 2
          maxItems: 64
          items:
            type: object
            required: [temperatureC, vceSatV, eOnJ, eOffJ]
            additionalProperties: true
            properties:
              temperatureC: { type: number }
              vceSatV: { type: number, exclusiveMinimum: 0 }
              eOnJ: { type: number, minimum: 0 }
              eOffJ: { type: number, minimum: 0 }
          description: Strictly ascending temperatureC; native does not extrapolate beyond the table.
        source: { type: string, maxLength: 512, description: Provenance label only; does not certify manufacturer calibration. }
    IgbtSpatialDie:
      type: object
      required: [id, bounds, operatingPoint, lossTable]
      additionalProperties: true
      properties:
        id: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,31}$' }
        bounds:
          type: object
          required: [min, max]
          additionalProperties: true
          properties:
            min: { type: array, minItems: 3, maxItems: 3, items: { type: number } }
            max: { type: array, minItems: 3, maxItems: 3, items: { type: number } }
        operatingPoint: { $ref: '#/components/schemas/IgbtSpatialElectricalOperatingPoint' }
        lossTable: { $ref: '#/components/schemas/IgbtSpatialLossTable' }
        initialJunctionTempC: { type: number, description: Defaults to the first loss-table temperature; must lie within the table. }
        source: { type: 'null', description: Die-level source is rejected when non-null; provenance belongs under lossTable.source. }
    IgbtSpatialCoupling:
      type: object
      required: [maxJunctionTempC]
      additionalProperties: true
      properties:
        maxJunctionTempC: { type: number, description: Finite upper limit; cannot exceed any die table maximum. }
        maxIterations: { type: integer, minimum: 1, maximum: 200, default: 100 }
        temperatureToleranceC: { type: number, exclusiveMinimum: 0, default: 1e-8 }
        relativePowerTolerance: { type: number, exclusiveMinimum: 0, default: 1e-10 }
        relaxationFactor: { type: number, exclusiveMinimum: 0, maximum: 1, default: 1 }
    IgbtJobSpec:
      type: object
      description: Existing electro-thermal-igbt JobSpecV1 kind with its legacy parameter modes retained and the explicitly typed spatial-chip branch added.
      required: [schemaVersion, kind, parameters, run, outputs]
      additionalProperties: true
      properties:
        schemaVersion: { const: 1 }
        kind: { const: electro-thermal-igbt }
        name: { type: string }
        workspaceId: { type: string }
        parameters: { $ref: '#/components/schemas/IgbtJobParameters' }
        model: { type: object, additionalProperties: true }
        run:
          type: object
          required: [maxSteps]
          additionalProperties: true
          properties:
            maxSteps: { type: integer, minimum: 1 }
            warmupSteps: { type: integer, minimum: 0 }
            forceSampleEvery: { type: integer, minimum: 1 }
        outputs: { type: object, additionalProperties: true }
        requirements: { type: object, additionalProperties: true }
    IgbtSpatialChipResult:
      type: object
      description: >-
        Successful electro-thermal-igbt spatial-chip completion. The native Agent
        saves the binary64 field and exact KPI JSON as Host artifacts before
        completion. Host validates artifact ownership/integrity and contract
        metadata, but does not independently solve the thermal or loss model.
        The current WaveWorld source tree includes a saved-result reader and result
        card for downloading and displaying these artifacts; deployment is separate.
      required: [schemaVersion, summary, backend, derived, artifacts]
      additionalProperties: true
      properties:
        schemaVersion: { const: 1 }
        backend:
          type: object
          required: [id, agentId]
          additionalProperties: true
          properties:
            id: { const: native-cuda }
            agentId: { type: string, minLength: 1 }
        summary:
          type: object
          description: >-
            Host requires finite global KPIs and the indexed per-die KPIs for every
            submitted die. summary.inputDigest and derived.inputDigest must match;
            this is a shape/metadata check, not an independent recomputation of the
            producer's normalized input digest.
          required: [steps, wallTimeMs, method, inputDigest, cellCount, gridNx, gridNy, gridNz, dieCount, converged, convergenceStatus, tMin, tMax, tjMaxC, caseMeanC, sourcePowerW, totalLossW, conductionLossW, switchingLossW, energyImbalance, residual, iterations, couplingIterations, temperatureChangeC, relativePowerChange, heatFlowInW, heatFlowLeftW, heatFlowRightW, heatFlowBottomW, heatFlowTopW, heatFlowFrontW, heatFlowBackW]
          additionalProperties: true
          patternProperties:
            '^die[0-9]+(JunctionMeanC|JunctionMinC|JunctionMaxC|LossEvaluationTempC|ConductionLossW|SwitchingLossW|TotalLossW|EvaluatedLossW)$': { type: number }
          properties:
            steps: { type: integer, minimum: 1, description: Equal to couplingIterations. }
            wallTimeMs: { type: number, minimum: 0 }
            method: { const: thermal-igbt-spatial-chip-v1 }
            inputDigest: { type: string, pattern: '^[a-f0-9]{32}$' }
            cellCount: { type: integer, minimum: 8 }
            gridNx: { type: integer, minimum: 2, maximum: 128 }
            gridNy: { type: integer, minimum: 2, maximum: 128 }
            gridNz: { type: integer, minimum: 2, maximum: 128 }
            dieCount: { type: integer, minimum: 1, maximum: 16 }
            converged: { const: 1 }
            convergenceStatus: { const: converged }
            tMin: { type: number }
            tMax: { type: number }
            tjMaxC: { type: number }
            caseMeanC: { type: number }
            ambientTempC: { type: number, description: Required for a Robin case face and omitted otherwise. }
            sourcePowerW: { type: number }
            totalLossW: { type: number }
            conductionLossW: { type: number }
            switchingLossW: { type: number }
            energyImbalance: { type: number }
            residual: { type: number, minimum: 0, description: Must be strictly below the submitted residualTol (default 1e-12). }
            iterations: { type: integer, minimum: 1 }
            couplingIterations: { type: integer, minimum: 1, maximum: 200, description: Positive outer count, bounded by the submitted coupling.maxIterations. }
            temperatureChangeC: { type: number, minimum: 0 }
            relativePowerChange: { type: number, minimum: 0 }
            heatFlowInW: { type: number }
            heatFlowLeftW: { type: number }
            heatFlowRightW: { type: number }
            heatFlowBottomW: { type: number }
            heatFlowTopW: { type: number }
            heatFlowFrontW: { type: number }
            heatFlowBackW: { type: number }
        derived:
          type: object
          required: [fieldFormat, dimension, lengthUnit, fieldArtifactId, cellCount, fieldBytes, fieldInline, temperatureUnit, inputDigest, igbtDieIds]
          additionalProperties: true
          properties:
            fieldFormat: { const: float64-le-x-fastest-v1 }
            dimension: { const: 3 }
            lengthUnit: { const: m }
            fieldArtifactId: { type: string, minLength: 1 }
            cellCount: { type: integer, minimum: 8 }
            fieldBytes: { type: integer, minimum: 64, description: Exactly cellCount times eight. }
            fieldInline: { enum: [0, 1], description: One at up to 256 cells; zero above 256 cells. }
            temperatureCsv: { type: string, description: Required with one exact decimal value per cell at up to 256 cells; forbidden above 256. }
            temperatureUnit: { enum: [C, K] }
            inputDigest: { type: string, pattern: '^[a-f0-9]{32}$' }
            igbtDieIds: { type: string, description: JSON-encoded array of die IDs in submitted order. }
        artifacts:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly one field and one KPI artifact; Host checks both are attached to this job/user/project and match their stored bytes/SHA.
          items:
            type: object
            required: [kind, artifactId, contentType, bytes]
            additionalProperties: true
            properties:
              kind: { enum: [thermal-temperature-field, thermal-kpi-summary] }
              artifactId: { type: string, minLength: 1 }
              contentType: { enum: [application/octet-stream, application/json] }
              bytes: { type: integer, minimum: 1, maximum: 33554432 }
          allOf:
            - contains:
                type: object
                required: [kind]
                properties: { kind: { const: thermal-temperature-field } }
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                required: [kind]
                properties: { kind: { const: thermal-kpi-summary } }
              minContains: 1
              maxContains: 1
    # Native numeric parameter parser also accepts {value: number}; null is
    # skipped when searching aliases. Domain-specific ranges remain solver admission.
    ThermalTransientNumberParameter:
      description: >-
        Finite scalar accepted by native numeric parameter aliases, either as a
        JSON number or {value:number}. Native solver admission applies field-specific
        ranges after alias resolution.
      oneOf:
        - { type: number }
        - type: object
          required: [value]
          properties:
            value: { type: number }
          additionalProperties: true
    ThermalTransientNullableNumberParameter:
      anyOf:
        - { $ref: '#/components/schemas/ThermalTransientNumberParameter' }
        - { type: 'null' }
    ThermalTransientBoundary:
      type: object
      description: >-
        Native face boundary. Fields are conditional on type and validated by
        W-Sim during execution; faces required depend on dimension. Dirichlet
        intersections with differing temperatures are rejected as boundary_conflict.
      additionalProperties: true
      properties:
        type:
          type: string
          enum: [dirichlet, neumann, insulated, robin]
        temperature: { type: [number, 'null'], description: Dirichlet value; also Robin ambient-temperature fallback. }
        heatFlux: { type: [number, 'null'], description: Neumann flux in parameters.units.heatFlux. }
        h: { type: [number, 'null'], minimum: 0, description: Robin heat-transfer coefficient in W/(m²·K). }
        heatTransferCoeff: { type: [number, 'null'], minimum: 0, description: Native alias for h. }
        ambientTemp: { type: [number, 'null'], description: Robin ambient temperature; preferred Robin ambient key. }
        tInf: { type: [number, 'null'], description: Native Robin ambient-temperature alias. }
    ThermalTransientMaterialRegion:
      type: object
      required: [bounds]
      description: >-
        Region bounds are physical coordinates. Native admission expects finite
        min/max triples; inactive axes are ignored. Later regions override
        previously supplied material properties per field. powerW and
        volumetricHeatWPerM3 are mutually exclusive; region powers add.
      additionalProperties: true
      properties:
        name: { type: [string, 'null'] }
        bounds:
          type: object
          required: [min, max]
          additionalProperties: true
          properties:
            min: { type: array, minItems: 3, maxItems: 3, items: { type: number }, description: Three finite physical coordinates. }
            max: { type: array, minItems: 3, maxItems: 3, items: { type: number }, description: Three finite physical coordinates. }
        conductivity: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        k: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        thermalConductivity: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        density: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        densityKgM3: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        rho: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        specificHeat: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        specificHeatJkgK: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        cp: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        powerW: { type: [number, 'null'], minimum: 0 }
        volumetricHeatWPerM3: { type: [number, 'null'], description: Region volumetric source; finite signed values are accepted by native admission. }
    ThermalTransientProbe:
      description: Native accepts either index object or positional array; indices are checked against the resolved grid at execution.
      oneOf:
        - type: object
          required: [i, j, k]
          additionalProperties: true
          properties:
            i: { type: integer, minimum: 0 }
            j: { type: integer, minimum: 0 }
            k: { type: integer, minimum: 0 }
        - type: array
          minItems: 3
          prefixItems:
            - { type: integer, minimum: 0 }
            - { type: integer, minimum: 0 }
            - { type: integer, minimum: 0 }
          items: true
    ThermalTransientJobParameters:
      type: object
      description: >-
        Parameters for native W-Sim kind thermal-3d-transient. This schema documents
        accepted wire fields; it does not represent WaveWorld Host solver-domain
        validation. Native admission resolves aliases/defaults and enforces active
        dimensions, face requirements, material/source rules, and stability.
      additionalProperties: true
      properties:
        dimension:
          anyOf:
            - { type: integer, enum: [1, 2, 3] }
            - { type: 'null' }
          description: >-
            Optional 1/2/3. If absent/null, native infers 3 from nz/lengthZ,
            else 2 from ny/lengthY, else 1. Active axes require at least 2
            nodes, each axis is capped at 128 nodes, and the total grid is capped
            at 1,048,576 cells.
        lengthX: { type: [number, 'null'], exclusiveMinimum: 0, description: X length in metres; native alias lengthM is used when absent/null. }
        lengthM: { type: [number, 'null'], exclusiveMinimum: 0, description: Native fallback alias for lengthX. }
        lengthY: { type: [number, 'null'], exclusiveMinimum: 0, description: Required by native for active Y dimensions; metres. }
        lengthZ: { type: [number, 'null'], exclusiveMinimum: 0, description: Required by native for 3D; metres. }
        nx: { type: [integer, 'null'], minimum: 2, maximum: 128, description: X nodes; defaults to 32. }
        ny: { type: [integer, 'null'], minimum: 2, maximum: 128, description: Active Y nodes; defaults to 32. }
        nz: { type: [integer, 'null'], minimum: 2, maximum: 128, description: Active Z nodes; defaults to 32. }
        gridN: { type: [integer, 'null'], minimum: 2, maximum: 128, description: Native fallback grid count for axes without an explicit per-axis count. }
        conductivity: { type: [number, 'null'], exclusiveMinimum: 0 }
        k: { type: [number, 'null'], exclusiveMinimum: 0, description: Native alias used when conductivity is absent/null. }
        thermalConductivity: { type: [number, 'null'], exclusiveMinimum: 0, description: Native fallback conductivity alias. }
        density: { type: [number, 'null'], exclusiveMinimum: 0 }
        densityKgM3: { type: [number, 'null'], exclusiveMinimum: 0, description: Native density alias used when density is absent/null. }
        rho: { type: [number, 'null'], exclusiveMinimum: 0, description: Native fallback density alias. }
        specificHeat: { type: [number, 'null'], exclusiveMinimum: 0 }
        specificHeatJkgK: { type: [number, 'null'], exclusiveMinimum: 0, description: Native specific-heat alias used when specificHeat is absent/null. }
        cp: { type: [number, 'null'], exclusiveMinimum: 0, description: Native fallback specific-heat alias. }
        volumetricHeatWPerM3: { type: [number, 'null'], description: Finite signed base volumetric source; takes precedence over powerW when non-null. }
        powerW: { type: [number, 'null'], minimum: 0, description: Native base total-power fallback when volumetricHeatWPerM3 is absent/null. }
        initialTemp: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        initialTemperature: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native initial-temperature alias used when initialTemp is absent/null. }
        tInit: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native fallback initial-temperature alias; defaults to 0. }
        initialField:
          type: [array, 'null']
          items: { type: number }
          description: >-
            Optional finite full field, native x-fastest order and exactly nx*ny*nz
            values. Null/omission uses initialTemp aliases; native rejects specifying
            both a non-null initialField and canonical initialTemp.
        ambientTemp: { type: [number, 'null'], description: Legacy left Dirichlet fallback when boundaries is absent/null. }
        heatSourceTemp: { type: [number, 'null'], description: Legacy right Dirichlet fallback when boundaries is absent/null. }
        tLeft: { type: [number, 'null'], description: Native fallback legacy left-temperature alias. }
        tRight: { type: [number, 'null'], description: Native fallback legacy right-temperature alias. }
        units:
          type: object
          description: >-
            Required by native solver admission. When supplied, all five labels are
            checked exactly; this schema does not make the object required at the
            generic Host intake layer.
          additionalProperties: true
          required: [length, temperature, conductivity, power, heatFlux]
          properties:
            length: { type: string, const: m }
            temperature: { type: string, enum: [C, K] }
            conductivity: { type: string, enum: ['W/(m·K)', 'W/(m.K)', 'W/m/K'] }
            power: { type: string, const: W }
            heatFlux: { type: string, enum: ['W/m^2', W/m2, 'W·m^-2'] }
            density: { type: string, description: Optional capture label; native admission does not inspect this label. }
            specificHeat: { type: string, description: Optional capture label; native admission does not inspect this label. }
        boundaries:
          type: [object, 'null']
          description: >-
            If an object, native expects left/right plus bottom/top for 2D/3D and
            front/back for 3D. If absent/null, native falls back to the legacy
            ambientTemp/heatSourceTemp (or tLeft/tRight) Dirichlet pair and makes
            other active faces insulated.
          additionalProperties: true
          properties:
            left: { $ref: '#/components/schemas/ThermalTransientBoundary' }
            right: { $ref: '#/components/schemas/ThermalTransientBoundary' }
            bottom: { $ref: '#/components/schemas/ThermalTransientBoundary' }
            top: { $ref: '#/components/schemas/ThermalTransientBoundary' }
            front: { $ref: '#/components/schemas/ThermalTransientBoundary' }
            back: { $ref: '#/components/schemas/ThermalTransientBoundary' }
        materials:
          type: [array, 'null']
          maxItems: 64
          items: { $ref: '#/components/schemas/ThermalTransientMaterialRegion' }
          description: Native primary regional-material list; when absent it reads regions.
        regions:
          type: [array, 'null']
          maxItems: 64
          items: { $ref: '#/components/schemas/ThermalTransientMaterialRegion' }
          description: Native alias for materials when materials is omitted.
        integrator:
          type: [string, 'null']
          description: >-
            Native case/whitespace-insensitive values: explicit, ftcs, forward-euler,
            implicit, backward-euler, beuler. Defaults to explicit.
        timeIntegrator: { type: [string, 'null'], description: Native fallback alias for integrator. }
        backend:
          type: [string, 'null']
          description: >-
            Native case/whitespace-insensitive values: host/cpu, gpu/cuda/native-cuda,
            auto. Defaults to host. gpu/cuda are native execution hints, not browser support.
        solver: { type: [string, 'null'], description: Native fallback alias for backend. }
        dt: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        timeStepS: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native dt alias. }
        dtSeconds: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native dt alias. }
        dtS: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native dt alias. }
        durationS: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter' }
        duration: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native duration alias. }
        tEnd: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native duration alias. }
        timeEndS: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native duration alias. }
        nSteps: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native integer step-count input; <= 1,000,000. }
        steps: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native step-count alias. }
        timeSteps: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native step-count alias. }
        sampleEvery: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Positive integer; defaults to 1. }
        historyEvery: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native sampling alias. }
        historyStride: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native sampling alias. }
        implicitTol: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Positive inner iteration tolerance; defaults to 1e-9. }
        innerTol: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native tolerance alias. }
        jacobiTol: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native tolerance alias. }
        implicitMaxIterations: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Integer from 1 to 100000; defaults to 500. }
        innerIterations: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native iteration-count alias. }
        maxInnerIterations: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native iteration-count alias. }
        relaxation: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: SOR omega in (0,2); defaults to 1. }
        sorOmega: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native SOR alias. }
        omega: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native SOR alias. }
        sor: { $ref: '#/components/schemas/ThermalTransientNullableNumberParameter', description: Native SOR alias. }
        probes:
          type: [array, 'null']
          maxItems: 256
          items: { $ref: '#/components/schemas/ThermalTransientProbe' }
          description: Optional probe list; native validates each index against the resolved grid.
    ThermalTransientJobSpec:
      type: object
      description: >-
        JobSpecV1 envelope for a native W-Sim thermal-3d-transient job. This
        documents the backend-native job shape; browser execution is not implied.
      required: [schemaVersion, kind, parameters, run, outputs]
      additionalProperties: true
      properties:
        schemaVersion: { const: 1 }
        kind: { const: thermal-3d-transient }
        name: { type: string }
        workspaceId: { type: string }
        parameters: { $ref: '#/components/schemas/ThermalTransientJobParameters' }
        model: { type: object, additionalProperties: true }
        run:
          type: object
          required: [maxSteps]
          additionalProperties: true
          properties:
            maxSteps: { type: integer, minimum: 1, description: JobSpecV1 execution budget; native may use as nSteps fallback. }
            warmupSteps: { type: integer, minimum: 0 }
            forceSampleEvery: { type: integer, minimum: 1 }
        outputs: { type: object, additionalProperties: true }
        requirements: { type: object, additionalProperties: true }
    StructuralJobSpec:
      type: object
      description: |
        Existing W-Sim static linear-elastic CPU/float64 job. bar, beam2d, CST
        plane stress/strain and tet4 are small educational models, limited to
        96 nodes, 256 elements and 288 DOFs. This is not a building-design,
        nonlinear, buckling, dynamic or general CAD-to-FEM solver. Units,
        elements, materials, constraints and loads follow StructuralJobParameters
        in the shared W-Sim contract. Rigid modes/singular systems fail explicitly.
        Mesh input may use parameters.nodes/elements or parameters.mesh.
        Beam stress requires an explicit positive elastic section modulus I/c
        for a section symmetric about its bending neutral axis. A and I alone
        do not identify the extreme fiber distance. Element values override the
        parameter default. The maximum uses recovered end moments and loads.
        If any beam section modulus is missing, result.summary.maxStressPa is
        omitted; derived.stressRecoveryStatus is section-modulus-required and
        derived.stressRecoveryNote explains the missing input. Displacements,
        axial stress and bending moments remain available. Complete recovery
        reports stressRecoveryStatus=complete. An absent stress is never zero.
        FEM fields within the admitted size limit are saved inline in result.derived
        (see StructuralFields), including meshes generated from presets. No
        structural artifact IDs are invented and no separate field upload is needed.
        Older results may lack these fields; their missing data cannot be recovered
        by reading the task. The existing result download contains inputs and fields.
      required: [schemaVersion, kind, parameters, run, outputs]
      properties:
        schemaVersion: { const: 1 }
        kind: { const: structural-static }
        parameters:
          type: object
          properties:
            elementType: { enum: [bar, beam2d, cst, tet4] }
            sectionModulusM3:
              type: number
              exclusiveMinimum: 0
              description: Finite default elastic bending section modulus Z=I/c in m3 for symmetric beam cross sections; optional for displacement-only calculation.
            elements:
              type: array
              maxItems: 256
              items: { $ref: '#/components/schemas/StructuralElement' }
            mesh:
              type: object
              properties:
                elements:
                  type: array
                  maxItems: 256
                  items: { $ref: '#/components/schemas/StructuralElement' }
        run: { type: object, required: [maxSteps], properties: { maxSteps: { type: integer, minimum: 1 } } }
        outputs: { type: object }
        requirements: { type: object }
    StructuralFields:
      type: object
      description: |
        Optional FEM fields in the shared result.derived object. New structural
        bar/beam2d/CST/tet4 results always inline their full admitted model (at most
        96 nodes, 256 elements, 288 DOFs). Numbers are comma-separated decimal
        strings without headers, in the saved node/element order. IDs are identifiers,
        not array indexes. DOF arrays are node-major. Metadata and array lengths
        must agree before joining fields; clients must not infer missing coordinates.
        Optional element fields have one token per element; an empty token is an
        unavailable value, never zero. Missing columns are not computed. Legacy
        fieldInline=0 results had no stored field bytes, despite synthetic IDs;
        clients should offer their existing JSON only, not synthetic file downloads.
        Kirchhoff analytical results contain summary values without a FEM field.
      properties:
        fieldInline: { type: integer, enum: [0, 1] }
        elementType: { type: string, examples: [bar, beam2d, cst, tet4] }
        continuumKind: { type: string, description: CST constitutive assumption, plane-stress or plane-strain. }
        nodeIdsCsv: { type: string, description: One node ID per node. }
        nodePositionsCsv: { type: string, description: Three coordinates x/y/z per node in metres, including zero z for planar models. }
        elementIdsCsv: { type: string, description: One element ID per element. }
        elementConnectivityCsv: { type: string, description: Node IDs per element; 2 for bar/beam2d, 3 for CST, 4 for tet4. }
        dofNamesCsv: { type: string, description: Per-node DOF names; ux for bar, ux/uy/rz for beam2d, ux/uy for CST, ux/uy/uz for tet4. }
        displacementUnitsCsv: { type: string, description: Per-DOF displacement units; m for translations and rad for rz. }
        reactionUnitsCsv: { type: string, description: Per-DOF reaction units; N for translations and N*m for rz. }
        displacementCsv: { type: string, description: One displacement or rotation per DOF. }
        reactionCsv: { type: string, description: One reaction force or moment per DOF, in the same order. }
        elementAxialStressCsv: { type: string, description: Per-element axial stress in Pa. }
        elementAxialStrainCsv: { type: string, description: Per-element axial strain, dimensionless. }
        elementLengthMCsv: { type: string, description: Line length for bar/beam; sqrt(2A) for CST or cbrt(6V) for tet4, in m. }
        elementAreaM2Csv: { type: string, description: Per-element area in m2 where available. }
        elementVolumeM3Csv: { type: string, description: Per-element volume in m3 where available. }
        elementBendingMoment1NmCsv: { type: string, description: Beam bending moment at node 1, N*m. }
        elementBendingMoment2NmCsv: { type: string, description: Beam bending moment at node 2, N*m. }
        elementMaxBendingMomentNmCsv: { type: string, description: Beam maximum absolute moment including interior extrema, N*m. }
        elementBendingStressPaCsv: { type: string, description: Beam maximum absolute bending stress, Pa; empty where section modulus is missing. }
        elementSxxCsv: { type: string }
        elementSyyCsv: { type: string }
        elementSzzCsv: { type: string }
        elementSxyCsv: { type: string }
        elementSyzCsv: { type: string }
        elementSzxCsv: { type: string }
        elementExxCsv: { type: string }
        elementEyyCsv: { type: string }
        elementEzzCsv: { type: string }
        elementGxyCsv: { type: string }
        elementGyzCsv: { type: string }
        elementGzxCsv: { type: string }
        stressUnit: { type: string, description: Pa for all stress tensor components. }
        strainUnit: { type: string, description: Dimensionless (1); Gxy/Gyz/Gzx are engineering shear strains gamma. }
    StructuralElement:
      type: object
      required: [n1, n2]
      properties:
        id: { type: integer }
        n1: { type: integer }
        n2: { type: integer }
        n3: { type: integer }
        n4: { type: integer }
        area: { type: number, exclusiveMinimum: 0, description: Section area in m2. }
        I: { type: number, exclusiveMinimum: 0, description: Second moment of area in m4. }
        thicknessM: { type: number, exclusiveMinimum: 0 }
        sectionModulusM3: { type: number, exclusiveMinimum: 0, description: Finite elastic section modulus in m3 for this symmetric beam cross section; overrides the parameter default. }
    MacJobSpec:
      type: object
      required: [schemaVersion, kind, parameters, model, run, outputs, requirements]
      description: |
        Supplied geometry must pass the shared per-solid boundary-edge check described
        for WGM2 and resolve at least one solid voxel. Empty/all-degenerate boundaries,
        open or non-manifold edges and inconsistent winding fail preparation (code 11).
        Repair the source geometry or supply closed solids; no automatic repair occurs.
        Passing admission does not certify self-intersection freedom or grid accuracy.
      properties:
        schemaVersion: { const: 1 }
        kind: { const: mac-3d }
        model:
          type: object
          required: [source, artifactId, referenceLength]
          properties:
            source: { const: artifact }
            artifactId: { type: string, format: uuid }
            referenceLength: { type: number, exclusiveMinimum: 0, description: Physical original model X span in meters. }
        parameters:
          type: object
          additionalProperties: false
          required: [grid, characteristicCells, dtSeconds, fluidDensity, fluidViscosity, openFaces]
          properties:
            grid: { type: array, minItems: 3, maxItems: 3, items: { type: integer, minimum: 3, maximum: 256 }, description: At most 1048576 total cells. }
            characteristicCells: { type: number, exclusiveMinimum: 0, description: "Original model X span in cells; dx=referenceLength/characteristicCells without rounding or viscosity adjustment." }
            dtSeconds: { type: number, exclusiveMinimum: 0 }
            fluidDensity: { type: number, exclusiveMinimum: 0, description: kg/m3. }
            fluidViscosity: { type: number, exclusiveMinimum: 0, description: Dynamic viscosity in Pa s; kinematic viscosity is fluidViscosity/fluidDensity. }
            openFaces: { type: integer, minimum: 0, maximum: 63, description: "Pressure openings bits 0..5: xMin,xMax,yMin,yMax,zMin,zMax." }
            projectionMaxIterations: { type: integer, minimum: 1, maximum: 4096, default: 500 }
            absoluteDivergenceTolerance: { type: number, exclusiveMinimum: 0, default: 0.000001, description: Hard maximum absolute divergence over ALL fluid cells including pinned cells, in s^-1. }
            fans: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/MacFan' } }
            thermalEnabled: { type: boolean }
            thermalMode: { enum: [fixed-temperature, solid-power], description: Explicitly required when thermalEnabled=true. }
            ambientTemp: { type: number, exclusiveMinimum: -273.15, default: 25 }
            heatSourceTemp: { type: number, description: Fixed-temperature only; must exceed ambientTemp. }
            solidDensityKgM3: { type: number, exclusiveMinimum: 0 }
            solidSpecificHeatJkgK: { type: number, exclusiveMinimum: 0 }
            solidConductivityWmK: { type: number, exclusiveMinimum: 0 }
            totalPowerW: { type: number, minimum: 0 }
            thermalRegions: { $ref: '#/components/schemas/LbmMeshJobSpec/properties/parameters/properties/thermalRegions' }
            thermalContacts: { $ref: '#/components/schemas/LbmMeshJobSpec/properties/parameters/properties/thermalContacts' }
            fluidSpecificHeatJkgK: { type: number, exclusiveMinimum: 0, default: 1005 }
            fluidConductivityWmK: { type: number, exclusiveMinimum: 0, default: 0.026 }
            thermalMaxSubsteps: { type: integer, minimum: 1, maximum: 4096, default: 4096 }
          description: |
            Unlisted LBM parameters are rejected. Temperature outputs and thermal inputs require
            thermalEnabled. Solid-power requires all three default material properties and
            totalPowerW; fixed-temperature forbids solid-power regions/contacts and heat sources.
            Combined thermal outgoing enthalpy plus conductance uses <=0.9 per substep;
            maxSubsteps exhaustion fails without changing requested dt, rho, cp or k.
        run:
          type: object
          required: [maxSteps]
          properties:
            maxSteps: { type: integer, minimum: 1, maximum: 1000000 }
            forceSampleEvery: { type: integer, minimum: 1, maximum: 1000000, default: 20, description: Existing envelope sampling interval; MAC records instantaneous diagnostics, not averaged forces. }
            warmupSteps: { const: 0 }
          not: { required: [stopWhen] }
        outputs:
          type: object
          properties:
            forces: { const: false }
            history: { type: boolean }
            fields: { type: array, uniqueItems: true, items: { enum: [velocity, pressure, temperature] } }
            fieldFrames: { type: integer, minimum: 1, maximum: 16, description: Requires fields. Count=min(requested or 1,maxSteps,floor(256MiB/frameBytes)); count 1 stores final only, otherwise steps=floor(1+i*(maxSteps-1)/(count-1)). }
          not: { required: [kpis] }
        requirements:
          type: object
          required: [backends, precision, features]
          properties:
            backends: { const: [cpu] }
            precision: { const: float64 }
            features: { type: array, items: { type: string }, contains: { const: mac-3d-v1 } }
    MacFan:
      type: object
      additionalProperties: false
      required: [name, center, axis, radiusM, rpmRatio, curve]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: Unique within this job. }
        center: { type: array, minItems: 3, maxItems: 3, items: { type: number, minimum: 0, maximum: 1 }, description: Normalized original model bounding box coordinates. }
        axis: { enum: [x, '-x', y, '-y', z, '-z'] }
        radiusM: { type: number, exclusiveMinimum: 0 }
        rpmRatio: { type: number, exclusiveMinimum: 0, maximum: 1, description: Actual RPM/reference RPM, not PWM duty. }
        curve:
          type: array
          minItems: 2
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [flowM3s, pressurePa]
            properties:
              flowM3s: { type: number, minimum: 0 }
              pressurePa: { type: number, minimum: 0 }
      description: |
        Supplied reference-RPM static P-Q data at the modeled density. Flow coordinates
        strictly increase from zero for rest start. Linear interpolation with fixed-geometry
        affinity dp(Q,s)=s²*dp_ref(Q/s). No extrapolation, flow clipping, reversed-net-flow
        or zero-RPM model. The nearest interior face plane is floor(centerCells[axis]+0.5).
        The entire disk circle must fit inside the domain; every selected face needs fluid
        on both sides. Same-axis/plane selected-face overlap is rejected. Force is distributed
        through a one-cell actuator region. This models no blades, fan inertial dynamics or
        motor and does not certify a manufacturer operating point.
    PreparedMacInput:
      type: object
      description: |
        Optional offline ComputeJobFile.mac, accompanied by the same owned flags.bin
        input protocol. It is never sent in a .lbm field. Shared prepareMacInput(spec,mesh)
        supplies nx,ny,nz,dxMeters,dtSeconds,density,kinematicViscosity,openFaces,
        projectionMaxIterations,absoluteDivergenceTolerance,solidCells,fans,fanPoints and
        optional existing ThermalUnits.thermal. Mapped fans contain name,axis(0..2),
        direction(-1/+1),centerCells[3],radiusMeters,rpmRatio,curveOffset,curveCount.
        fanPoints is the concatenated supplied flowM3s/pressurePa curves. Native verifies
        spec/prepared scalar, material, contact and curve agreement; Host re-prepares the
        owned exact geometry for final result verification. Neither transport changes dt/nu.
    LbmMeshJobSpec:
      type: object
      required: [schemaVersion, kind, parameters, model, run, outputs]
      description: |
        Mesh preparation requires finite xyz triples, a positive original X span and
        a complete rotated model inside the physical lattice domain [0,nx] x [0,ny] x [0,nz].
        These bounds apply with or without ground; geometry is never silently cropped.
        Exact boundary contact is allowed, including zero ground clearance. A supplied
        model must pass the shared per-solid boundary-edge check described for WGM2
        and resolve at least one solid voxel at the requested resolution. Empty or
        all-degenerate boundaries, open/non-manifold edges and inconsistent winding
        fail with code 11; source geometry must be repaired or replaced with closed solids.
        These checks do not establish absence of self-intersection, enclosed volume,
        mesh convergence or a resolved fluid gap. Host preparation rejects invalid inputs
        before any W-Compute quote or instance creation. Browser preflight checks placement
        before uploading/publishing.
      properties:
        schemaVersion: { const: 1 }
        kind: { const: lbm-d3q19 }
        parameters:
          type: object
          required: [gridPreset, inletVelocity]
          description: Existing FluidJobParameters; used unchanged in browser and backend.
          properties:
            gridPreset: { enum: [fast, standard, fine] }
            inletVelocity: { type: number, minimum: 0 }
            fluidDensity: { type: number, exclusiveMinimum: 0, default: 1.225, description: Density in kg/m3. }
            fluidViscosity: { type: number, exclusiveMinimum: 0, description: "Dynamic viscosity in Pa*s. When omitted, the shared air kinematic viscosity 1.48e-5 m2/s is used." }
            viscosityMode:
              enum: [physical, stabilized-preview]
              default: physical
              description: Physical preserves the requested kinematic viscosity and rejects unresolved tau below 0.505. Explicit stabilized-preview may increase viscosity for a coarse-grid demonstration and reports the actual value and Reynolds number; it does not preserve the original physical case. Thermal runs require physical. The Lab UI explicitly selects preview for its nonthermal demo default.
            fan: { $ref: '#/components/schemas/LbmFanComponent' }
            ground: { $ref: '#/components/schemas/LbmGroundBoundary' }
            wallCondition:
              enum: [no-slip, slip]
              description: Impermeable outer side walls; slip uses specular reflection. With ground enabled this controls only the top and two lateral walls; ground controls the bottom. Model solids remain fixed no-slip.
            thermalEnabled: { type: boolean, default: false }
            thermalMode: { enum: [fixed-temperature, solid-power], default: fixed-temperature }
            ambientTemp: { type: number, exclusiveMinimum: -273.15, default: 25 }
            heatSourceTemp: { type: number, default: 60, description: Must exceed ambientTemp in fixed-temperature mode; ignored for solid-power. }
            dtSeconds:
              type: number
              exclusiveMinimum: 0
              description: >-
                Explicit physical time step, never adjusted. Defaults to 0.0001 for solid-power.
                When omitted for fixed-temperature, the shared preprocessor chooses a step from
                tau >= 0.505 and reference lattice speed < 0.2, targeting speed 0.06 when feasible.
                An empty feasible interval is rejected; physical viscosity is never changed.
                The resolved step is recorded in result.derived.dt and the prepared native input.
            totalPowerW: { type: number, minimum: 0, description: Required for solid-power. Total power shared by default solid cells outside thermalRegions; with no regions this is the whole voxelized solid. Must be zero if regions cover all solid cells. }
            solidDensityKgM3: { type: number, exclusiveMinimum: 0, description: Required for solid-power. }
            solidSpecificHeatJkgK: { type: number, exclusiveMinimum: 0, description: Required for solid-power. }
            solidConductivityWmK: { type: number, exclusiveMinimum: 0, description: Required for solid-power. }
            thermalRegions:
              type: array
              maxItems: 16
              items: { $ref: '#/components/schemas/LbmThermalRegion' }
              description: Optional per-region materials and powers; nonempty requires thermalEnabled=true and thermalMode=solid-power. Names must be unique. Positive-volume overlap is rejected; adjacent faces are allowed. Every region must resolve at least one existing solid cell. Empty arrays retain single-material behavior.
            thermalContacts:
              type: array
              maxItems: 136
              items: { $ref: '#/components/schemas/LbmThermalContact' }
              description: Optional interface resistances. Nonempty requires thermalEnabled=true and thermalMode=solid-power. Pairs must be unique regardless of order and share an actual voxel face; invalid or unresolved pairs fail before instance allocation.
            fluidSpecificHeatJkgK: { type: number, exclusiveMinimum: 0, default: 1005, description: Default is an air approximation. }
            fluidConductivityWmK: { type: number, exclusiveMinimum: 0, default: 0.026, description: Default is an air approximation. }
        model:
          type: object
          required: [source, artifactId]
          properties:
            source: { const: artifact }
            artifactId: { type: string, format: uuid }
            referenceLength: { type: number, exclusiveMinimum: 0, description: Physical metres represented by the unrotated mesh X span. Geometry coordinates need not be in metres; this supplies their uniform scale without rewriting vertices. }
            referenceArea: { type: number, exclusiveMinimum: 0, description: "Explicit coefficient normalization area in square metres. If omitted for a resolved model, uses its actual voxel projection on the YZ plane times dx squared, without a physical-area lower clamp." }
        run:
          type: object
          required: [maxSteps]
          description: Thermal runs execute maxSteps; maxCdVariance stopping is rejected because drag convergence does not establish temperature convergence. Cd stopping also requires positive inletVelocity. Sampling and stopping are independent of outputs.history.
          properties:
            maxSteps: { type: integer, minimum: 1 }
            forceSampleEvery: { type: integer, minimum: 1, default: 20, description: Sample at absolute step multiples and the final step. Forces and coefficients average all steps since the preceding sample or warmup boundary; history.step is the interval end. }
            warmupSteps: { type: integer, minimum: 0, default: 0, description: Exclude the first W steps from force history and convergence. Flush accumulated force at W even between normal samples. W may equal maxSteps; then history is empty and summary describes the final warmup block. The last saved flow field always shows the completed final step. }
            stopWhen:
              type: object
              properties:
                maxCdVariance: { type: number, minimum: 0, maximum: 1e100, description: "Absolute population variance of the last window Cd interval averages, sum((Cd_i-mean)^2)/window. Not standard deviation, relative error, a per-step variance, or proof of flow/mesh convergence. Unequal-length sampling intervals each have one equal weight." }
                window: { type: integer, minimum: 2, maximum: 1000000, default: 10, description: Number of post-warmup force samples used by the stopping check. }
        outputs:
          type: object
          description: Nonempty fields require actual sampled lbm-display artifacts before successful settlement; temperature requires thermalEnabled; pressure requires lbm-pressure-field-v1, WVF2 and saved pressureScalePa. Omitting fieldFrames preserves final-only output.
          properties:
            forces: { type: boolean }
            history: { type: boolean }
            fields: { type: array, uniqueItems: true, items: { enum: [velocity, vorticity, temperature, pressure] } }
            fieldFrames:
              type: integer
              minimum: 1
              maximum: 16
              default: 1
              description: >-
                LBM-only requested field samples; requires nonempty fields. More than one
                requires the lbm-field-history-v1 executor feature. Actual count is the minimum
                of fieldFrames, maxSteps and floor(268435456/frameBytes), where frameBytes is
                32 + nx*ny*nz*(3 + (thermalEnabled ? 1 : 0) + (pressure requested ? 1 : 0))*4 and each frame is at most 33554432 bytes.
                For count greater than one, steps are floor(1+i*(maxSteps-1)/(count-1)), i=0..count-1.
                A single sample is the final step. Early convergence truncates the schedule
                and appends the actual final step exactly once. Each WVF1/WVF2 frame preserves
                the original grid, units and mask. Physical frame time is step*result.derived.dt;
                recording never changes integration or force sampling.
        requirements:
          type: object
          description: All new LBM jobs require lbm-gauge-force-v1, lbm-nee-outlet-v1, lbm-nee-inlet-v1 and lbm-mass-balance-v1; Host adds them before fingerprinting and prior-result lookup without mutating historical rows. Native/WASM requires exactly backends=[cpu] and precision=mixed. WebGPU thermal requires nonempty GPU-only backends and precision=float32. Browser execution accepts webgpu or webgpu-browser; resident Node Agents accept webgpu or webgpu-dawn. CPU is the UI default. Other admitted solvers retain their capabilities.
          properties:
            backends: { type: array, items: { enum: [cpu, webgpu, webgpu-dawn, webgpu-browser] } }
            features: { $ref: '#/components/schemas/AgentExecutionFeatures' }
            precision:
              oneOf:
                - { enum: [mixed, float32] }
                - { type: array, minItems: 1, items: { const: float32 } }
    LbmGroundBoundary:
      type: object
      required: [mode, clearanceM]
      description: |
        Optional bottom plane at geometric lattice y=0 (cell centers are index+0.5).
        Omission keeps the original centered placement and common outer-wall condition.
        With ground enabled the rotated complete mesh minimum y, including wheels, is
        placed clearanceM above the bottom plane; this is not a chassis-only clearance.
        Model, fan and thermal regions share the transform. Out-of-domain geometry fails
        preparation. Subcell geometry is voxelized at the requested resolution.
        The bottom wall is adiabatic and no-slip. Moving means positive-X wall speed
        equal to inletVelocity; stationary means zero. Inlet/outlet resets retain precedence
        at their intersections. Ground reaction is not included in model forces.
        New model forces use lbm-gauge-force-v1: subtract the fixed rho_ref=1
        rest-equilibrium momentum contribution on each model link. A stationary
        equilibrium body touching a wall therefore has no reference-pressure load.
        Ground reaction remains separate; zero clearance does not establish a
        validated aerodynamic lift. Historical unmarked results contain raw force.
      properties:
        mode: { enum: [stationary, moving] }
        clearanceM: { type: number, minimum: 0, description: Metres from the rotated complete model minimum to the ground. }
    ComputeLbmGroundVelocity:
      type: number
      minimum: 0
      exclusiveMaximum: 0.2
      description: |
        Optional ComputeJobFile.lbm.groundVelocityLattice. Omitted exactly when ground
        is absent. Zero represents a stationary ground; moving equals inletVelocity*dt/dx.
        Native/WASM reject missing or altered prepared values. WASM ABI 11 preserves the
        previously reserved enabled u32 at byte 244 and speed f64 at byte 248;
        disabled uses zero bytes. The configuration remains 1888 bytes.
    LbmThermalRegion:
      type: object
      required: [name, bounds, solidDensityKgM3, solidSpecificHeatJkgK, solidConductivityWmK, totalPowerW]
      description: |
        A material assignment to existing voxelized solid cells, not a separate mesh or solver.
        Coordinates are fractions of the original unrotated model bounding box. Region selection
        transforms cell centers back into that frame, so changing angleOfAttack rotates the region
        with its model. Bounds are half-open [min,max), with max=1 including the upper model edge.
        Each axis requires min<max. Names are metadata. Ideal solid contact has no added resistance.
        Existing surface voxelization may produce occupied cells with centers outside the original
        model box. Those cells retain the default material, even when bounds cover [0,1] on all axes.
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: Nonblank after trimming and unique within thermalRegions. }
        bounds:
          type: object
          required: [min, max]
          properties:
            min: { type: array, minItems: 3, maxItems: 3, items: { type: number, minimum: 0, maximum: 1 } }
            max: { type: array, minItems: 3, maxItems: 3, items: { type: number, minimum: 0, maximum: 1 } }
        solidDensityKgM3: { type: number, exclusiveMinimum: 0 }
        solidSpecificHeatJkgK: { type: number, exclusiveMinimum: 0 }
        solidConductivityWmK: { type: number, exclusiveMinimum: 0 }
        totalPowerW: { type: number, minimum: 0, description: Total power evenly divided among this region's actual solid cells. Zero permits passive heat conduction. }
    LbmThermalContact:
      type: object
      required: [first, second, resistanceM2KW]
      description: |
        Material 0 is default conducting solid (flag 4); materials 1..16 refer to
        thermalRegions[index-1] (flags 5..20). first and second must differ and refer
        to existing materials. The unordered pair must resolve at least one shared
        solid voxel face. Resistance applies to all faces of that material pair.
        This is area-normalized resistance (m²·K/W), not lumped part resistance (K/W).
        Face conductance is dx²/(dx/(2*k1) + resistanceM2KW + dx/(2*k2)) W/K.
        A zero resistance or an unspecified pair uses the original ideal-contact
        expression exactly. Non-finite or unrepresentable conductance is rejected.
        Removing a Lab region removes its contacts and remaps remaining material indices.
      properties:
        first: { type: integer, minimum: 0, maximum: 16 }
        second: { type: integer, minimum: 0, maximum: 16 }
        resistanceM2KW: { type: number, minimum: 0 }
    ComputeLbmUnits:
      type: object
      required: [dx, dt, uLattice, reynoldsPhysical, reynoldsLattice, requestedViscosityM2s, simulatedViscosityM2s, viscosityMode]
      description: |
        ComputeJobFile.lbm.units prepared by Host and checked by native/WASM before execution.
        Actual base kinematic viscosity equals (tau-0.5)*dx^2/(3*dt); local LES eddy viscosity
        is not included. The three viscosity diagnostics must match the submitted mode/material
        and are copied to result.derived. Upgrade the native container with the Host.
        ComputeJobFile.lbm.coefficientScale is optional: omit it at zero inlet; otherwise it is
        1/(0.5*density*inletVelocity^2*referenceArea). A zero placeholder is rejected.
        Prepared uInlet must equal inletVelocity*dt/dx, forceScale must equal density*dx^4/dt^2,
        and referenceArea must match model.referenceArea when explicitly supplied.
        A mismatch is rejected before execution. Host settlement also requires the explicitly
        submitted referenceArea in result.derived.
      properties:
        dx: { type: number, exclusiveMinimum: 0, description: Metres per cell. }
        dt: { type: number, exclusiveMinimum: 0, description: Seconds per step. }
        uLattice: { type: number, minimum: 0, description: Reference display velocity; a static nonthermal case retains a positive display reference while actual uInlet is zero. }
        reynoldsPhysical: { type: number, minimum: 0 }
        reynoldsLattice: { type: number, minimum: 0 }
        requestedViscosityM2s: { type: number, exclusiveMinimum: 0 }
        simulatedViscosityM2s: { type: number, exclusiveMinimum: 0 }
        viscosityMode: { enum: [physical, stabilized-preview] }
    ComputeThermalContacts:
      type: array
      maxItems: 136
      description: |
        Optional ComputeJobFile.lbm.thermal.contacts copies thermalContacts in submission
        order. Native/WASM validate endpoints and resistances against the original job;
        missing or altered prepared contacts fail. The existing flags.bin and numeric
        palette identify actual contacting faces; no extra artifact is required.
      items: { $ref: '#/components/schemas/LbmThermalContact' }
    AgentExecutionFeatures:
      type: array
      uniqueItems: true
      items: { type: string }
      description: |
        Optional capabilities.features in Agent registration, capability update and catalog
        responses. Advertise features implemented by the installed executor. All explicit
        JobRequirements.features must be present. Host additionally derives
        lbm-gauge-force-v1, lbm-nee-outlet-v1, lbm-nee-inlet-v1 and lbm-mass-balance-v1 for every LBM job and records them in new request features
        before fingerprinting or checking prior results. It additionally derives
        lbm-pressure-field-v1 when outputs.fields contains pressure,
        lbm-field-history-v1 when outputs.fieldFrames exceeds one,
        lbm-ground-v1 from the actual ground parameter, and
        lbm-thermal-regions-v1 and lbm-thermal-contacts-v1 from the actual nonempty LBM
        parameter arrays; thermal=true alone cannot claim those tasks. Thermal executors
        also report derived[feature]=1 for both features in JobResultV1. Host requires
        1 for each feature used by the submitted job before settlement; older browser
        bundles or managed images cannot silently return results that ignore new physics.
        This declares implementation support, not engineering accuracy. Unknown features
        are retained and only satisfy an identical requirement. Older executors cannot
        claim LBM jobs or settle an unmarked first result. Previously completed LBM
        results remain readable and are not upgraded by reuse. Browser/managed execution and
        resident Agents must be released with the matching W-Sim kernel and loader.
    ComputeThermalMaterials:
      type: array
      maxItems: 16
      description: |
        Optional prepared ComputeJobFile.lbm.thermal.materials in thermalRegions order;
        entry i corresponds to flags.bin value 5+i. The existing material and power fields
        apply only to default solid cells with flag 4. Host computes region assignments using
        shared Rust/WASM before instance allocation and persists the same single flags.bin.
        Native validates palette values against the job and rejects unassigned material IDs.
        No extra input artifact, credentials or per-cell property buffers are introduced.
      items:
        type: object
        required: [density, specificHeat, conductivity, totalPowerW]
        properties:
          density: { type: number, exclusiveMinimum: 0 }
          specificHeat: { type: number, exclusiveMinimum: 0 }
          conductivity: { type: number, exclusiveMinimum: 0 }
          totalPowerW: { type: number, minimum: 0 }
    LbmFanComponent:
      type: object
      required: [center, axis, radiusM, pressureRisePa]
      description: >-
        Optional single constant-pressure actuator disk, shared by browser and backend.
        Center and axis refer to the original model bounding box; both rotate with angleOfAttack.
        Radius is in physical meters using model.referenceLength. A one-cell-thick fluid disk
        receives acceleration pressureRisePa/(fluidDensity*dx), integrated by Guo forcing.
        Preparation rejects an unresolved disk, a disk outside the domain or one with no fluid cells.
        Host only leases these jobs to an Agent explicitly advertising capabilities.fan=true;
        absent or false means unsupported, so older Agents cannot silently ignore the component.
        This approximation does not model rotating blades or a pressure-flow curve.
      properties:
        center:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number, minimum: 0, maximum: 1 }
        axis: { enum: [x, '-x', y, '-y', z, '-z'] }
        radiusM: { type: number, exclusiveMinimum: 0 }
        pressureRisePa: { type: number, exclusiveMinimum: 0, maximum: 10000 }
