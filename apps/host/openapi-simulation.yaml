                  componentId: { type: string }
                  kind: { type: string }
                  x: { type: number }
                  y: { type: number }
                  intensity: { type: number }
                  wavelengthNm: { type: number }
                  s: { type: number }
            events:
              type: array
              maxItems: 20000
              items:
                type: object
                required: [type, componentId, componentKind, x, y, intensityIn]
                properties:
                  type: { enum: [reflect, refract, tir, lens, polarize, split, screen, block] }
                  componentId: { type: string }
                  componentKind: { type: string }
                  x: { type: number }
                  y: { type: number }
                  intensityIn: { type: number }
                  intensityOut: { type: number }
                  thetaIDeg: { type: number }
                  thetaTDeg: { type: number }
                  note: { type: string }
            screenPower: { type: object, additionalProperties: { type: number, minimum: 0 } }
            profiles:
              type: array
              maxItems: 64
              items:
                type: object
                required: [componentId, bins, total, peakBin, peakS]
                properties:
                  componentId: { type: string }
                  bins: { type: array, minItems: 48, maxItems: 48, items: { type: number } }
                  total: { type: number, minimum: 0 }
                  peakBin: { type: integer, minimum: 0, maximum: 47 }
                  peakS: { type: number, minimum: 0, maximum: 1 }

    Heat2DInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: sim }
        scene:
          type: object
          required: [r, steps, seeds]
          description: Reduced-unit 192x120 FTCS grid with insulated walls. Deposits are initial conditions, not continuous heat sources. Browser WebGPU or CPU and backend CPU use the same stencil and deposits.
          properties:
            r: { type: number, minimum: 0.05, maximum: 0.25 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            seeds:
              type: array
              maxItems: 32
              items:
                type: object
                required: [x, y, radius, amount]
                properties:
                  x: { type: integer, minimum: 0, maximum: 191 }
                  y: { type: integer, minimum: 0, maximum: 119 }
                  radius: { type: integer, minimum: 1, maximum: 20 }
                  amount: { type: number, minimum: 0, maximum: 1000 }
    Heat2DOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: sim }
        result:
          type: object
          required: [width, height, steps, field, peak, total]
          properties:
            width: { const: 192 }
            height: { const: 120 }
            steps: { type: integer, minimum: 1, maximum: 2000, description: Must equal requested steps. }
            field: { type: array, minItems: 23040, maxItems: 23040, items: { type: number, minimum: 0, maximum: 32000 }, description: Row-major FP32 values serialized as JSON numbers. }
            peak: { type: number, minimum: 0, maximum: 32000 }
            total: { type: number, minimum: 0, maximum: 737280000 }
    Heat1DInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: heaterfc }
        scene:
          type: object
          required: [kappa, steps]
          description: 201-node reduced-unit interval [0,10], initially 1 left of x=5 and 0 right of it, midpoint 0.5. Endpoints stay fixed at 1 and 0. FTCS ratio is 0.4, so dt=0.4*(10/200)^2/kappa. Equal step counts have equal profiles but different elapsed times when kappa changes.
          properties:
            kappa: { type: number, minimum: 0.1, maximum: 1.5 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
    Heat1DOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: heaterfc }
        result:
          type: object
          required: [steps, time, dt, temperatures, reference, diffusionLength, maxError]
          properties:
            steps: { type: integer, minimum: 1, maximum: 2000, description: Must equal requested steps. }
            time: { type: number, minimum: 0, description: Completed steps multiplied by dt, within floating-point accumulation tolerance. }
            dt: { type: number, exclusiveMinimum: 0, description: 0.4*(10/200)^2/kappa. }
            temperatures: { type: array, minItems: 201, maxItems: 201, items: { type: number, minimum: 0, maximum: 1 }, description: FP32 temperature profile, serialized as JSON numbers. }
            reference: { type: array, minItems: 201, maxItems: 201, items: { type: number, minimum: 0, maximum: 1 }, description: Infinite-domain erfc reference at the same nodes and time, not the exact finite-domain solution. }
            diffusionLength: { type: number, minimum: 0, maximum: 10 }
            maxError: { type: number, minimum: 0, maximum: 1, description: Actual maximum absolute difference between numerical and reference profiles; no fixed percentage guarantee. }

    RippleInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: ripple }
        scene:
          type: object
          required: [damping, steps, seeds]
          description: |
            Reduced 180x180 scalar wave, a=c^2*dt^2/dx^2=0.25, fixed-zero walls.
            Initial circular displacement deposits add equally to current and
            previous fields. These finite pulses are not sustained sources.
            Every step uses uNext=(2*u-uPrev+a*laplacian(u))*damping.
          properties:
            damping: { type: number, minimum: 0.98, maximum: 1 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            seeds:
              type: array
              maxItems: 64
              items:
                type: object
                required: [x, y, radius, amount]
                properties:
                  x: { type: integer, minimum: 1, maximum: 178 }
                  y: { type: integer, minimum: 1, maximum: 178 }
                  radius: { type: integer, minimum: 1, maximum: 12 }
                  amount: { type: number, minimum: -8, maximum: 8 }
    RippleOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: ripple }
        result:
          type: object
          required: [nx, steps, field, peak, rms]
          properties:
            nx: { const: 180 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            field: { type: array, minItems: 32400, maxItems: 32400, items: { type: number }, description: Row-major final FP32 displacement values; all four boundary edges must equal zero. }
            peak: { type: number, minimum: 0, description: Maximum absolute displacement in the returned field. }
            rms: { type: number, minimum: 0, description: "sqrt(sum(u^2)/32400); not total physical wave energy." }
    ConvectionInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: convection }
        scene:
          type: object
          required: [buoyancy, steps, initialDrop, seeds]
          description: |
            Reduced 110x110 Stable Fluids scene, dt=0.1, viscosity=diffusivity=0,
            ambient=0 and 14 in-place Gauss-Seidel pressure iterations per projection.
            Temperature is advected and drives Boussinesq force in -y for positive
            temperature. Every solver step multiplies temperature by 0.997.
            This numerical cooling is not a calibrated heat-transfer coefficient.
            No solid conduction, radiation or material calibration is included.
          properties:
            buoyancy: { type: number, minimum: 0, maximum: 0.2 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            initialDrop: { type: boolean, description: "When true, add temperature +90 and vy +0.6 to x=52..58, y=8..13 before integration." }
            seeds:
              type: array
              maxItems: 64
              description: Additional initial radius-3 disks, clipped to interior cells (1..108). Hot adds temperature +90 and vy +0.4; cold adds temperature -90 and vy -0.2.
              items:
                type: object
                required: [x, y, hot]
                properties:
                  x: { type: integer, minimum: 1, maximum: 108 }
                  y: { type: integer, minimum: 1, maximum: 108 }
                  hot: { type: boolean }
    ConvectionField:
      type: array
      minItems: 12100
      maxItems: 12100
      items: { type: number }
      description: Row-major final FP32 values, including boundary ghost cells.
    ConvectionOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: convection }
        result:
          type: object
          required: [nx, steps, dt, time, temperature, vx, vy, minTemperature, maxTemperature, maxSpeed, gridDivergence]
          description: "Reduced-unit final fields; time=steps*dt. Summary extrema must match the returned arrays."
          properties:
            nx: { const: 110 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            dt: { const: 0.1 }
            time: { type: number, exclusiveMinimum: 0 }
            temperature: { $ref: '#/components/schemas/ConvectionField' }
            vx: { $ref: '#/components/schemas/ConvectionField' }
            vy: { $ref: '#/components/schemas/ConvectionField' }
            minTemperature: { type: number }
            maxTemperature: { type: number }
            maxSpeed: { type: number, minimum: 0 }
            gridDivergence: { type: number, minimum: 0, description: "Maximum interior abs(0.5*(vx[x+1]-vx[x-1]+vy[y+1]-vy[y-1])); a grid difference residual, not calibrated SI divergence." }
    IsingInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: ising }
        scene:
          type: object
          required: [size, temperatures, seed, hot, burnIn, samples]
          description: |
            Seeded periodic square lattice, J=kB=1. One sweep makes size^2
            Metropolis flip attempts. Keep the lattice and RNG across the explicit
            temperature sequence, discard burnIn sweeps and sample once per sweep.
            temperatures.length * (burnIn + samples) must not exceed 2000
            and must equal run.maxSteps; enforced by both Host and Agent.
          properties:
            size: { type: integer, minimum: 16, maximum: 256 }
            temperatures: { type: array, minItems: 1, maxItems: 57, items: { type: number, minimum: 0.5, maximum: 4 } }
            seed: { type: integer, minimum: 0, maximum: 4294967295 }
            hot: { type: boolean, description: "true: seeded random spins; false: all +1." }
            burnIn: { type: integer, minimum: 0, maximum: 1000 }
            samples: { type: integer, minimum: 1, maximum: 1000 }
    IsingPoint:
      type: object
      required: [temperature, samples, meanM, meanAbsM, meanEnergy, specificHeat, susceptibility, reference]
      description: |
        Completed sample means per spin; m is signed magnetization.
        C/N = N*var(e)/T^2 and chi/N = N*var(m)/T, using population variance.
        Both fluctuation estimates are null with a single sample.
        The infinite-lattice reference is not a guarantee of finite-run equilibrium.
      properties:
        temperature: { type: number, minimum: 0.5, maximum: 4 }
        samples: { type: integer, minimum: 1, maximum: 1000 }
        meanM: { type: number, minimum: -1, maximum: 1 }
        meanAbsM: { type: number, minimum: 0, maximum: 1 }
        meanEnergy: { type: number, minimum: -2, maximum: 2 }
        specificHeat: { type: [number, 'null'], minimum: 0 }
        susceptibility: { type: [number, 'null'], minimum: 0 }
        reference: { type: number, minimum: 0, maximum: 1 }
      allOf:
        - if:
            properties: { samples: { const: 1 } }
          then:
            properties: { specificHeat: { const: null }, susceptibility: { const: null } }
          else:
            properties: { specificHeat: { type: number }, susceptibility: { type: number } }
    IsingOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: ising }
        result:
          type: object
          required: [size, steps, spins, magnetization, energy, current, points]
          description: |
            Final size^2 spins in row-major order and instantaneous |m|, E/N.
            Size and total sweeps match the input. Points match the submitted
            temperature sequence and sample count; current equals the final point.
          properties:
            size: { type: integer, minimum: 16, maximum: 256 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            spins: { type: array, minItems: 256, maxItems: 65536, items: { enum: [-1, 1] } }
            magnetization: { type: number, minimum: 0, maximum: 1 }
            energy: { type: number, minimum: -2, maximum: 2 }
            current: { $ref: '#/components/schemas/IsingPoint' }
            points: { type: array, minItems: 1, maxItems: 57, items: { $ref: '#/components/schemas/IsingPoint' } }
    VibrationInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: vibration }
        scene:
          type: object
          required: [mass, stiffness, damping, driveFrequency, steps]
          description: "Forced damped oscillator: m*x'' + c*x' + k*x = cos(2*pi*f*t), initially at rest; RK4, dt=1/240 s, CPU FP64."
          properties:
            mass: { type: number, minimum: 0.2, maximum: 5, description: kg }
            stiffness: { type: number, minimum: 10, maximum: 400, description: N/m }
            damping: { type: number, minimum: 0.05, maximum: 8, description: N*s/m }
            driveFrequency: { type: number, minimum: 0.2, maximum: 5, description: Hz }
            steps: { type: integer, minimum: 1, maximum: 2000 }
    VibrationOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: vibration }
        result:
          type: object
          required: [steps, dt, time, states, omega0, amplitude, resonance]
          description: |
            Full steps+1 trajectory, including the initial rest sample.
            Time equals steps*dt, omega0=sqrt(k/m). Amplitude and resonance
            are analytic steady-state responses; the finite transient may not be settled.
          properties:
            steps: { type: integer, minimum: 1, maximum: 2000 }
            dt: { const: 0.004166666666666667 }
            time: { type: number, exclusiveMinimum: 0 }
            states:
              type: array
              minItems: 2
              maxItems: 2001
              items:
                type: object
                required: [x, v]
                properties:
                  x: { type: number, description: m }
                  v: { type: number, description: m/s }
            omega0: { type: number, exclusiveMinimum: 0, description: rad/s }
            amplitude: { type: number, minimum: 0, description: m }
            resonance:
              type: object
              required: [omega, amplitude]
              properties:
                omega: { type: array, minItems: 80, maxItems: 80, items: { type: number, minimum: 0 }, description: "Uniform rad/s samples from max(0.1, 0.2*omega0) to 2.5*omega0." }
                amplitude: { type: array, minItems: 80, maxItems: 80, items: { type: number, minimum: 0 }, description: Analytic steady-state displacement in m. }
    ComputeMdInput:
      type: object
      description: |
        Prepared offline input for the native executor, not an additional HTTP request.
        Host persists this as ComputeJobFile.md before allocating the instance. Browser preparation
        uses the same seeded lattice and Box-Muller function, or supplied positions/velocities;
        Rust consumes the exact f32 arrays. Each pos/vel array has n*dim values.
        Homogeneous md omits particles, n matches scene.N and boxL=sqrt(n/0.8).
        Module particles requires the nested properties, n=sum(scene.species.count), and boxL=scene.boxL.
        Explicit scene.kind and imported positions/velocities must be preserved after f32 conversion.
        Input positions lie in [0,boxL); f32 rounding can put an imported value on the upper edge.
        The executor validates dimensions, coefficients, species assignments and finite fields.
        The unchanged MD and particles scene/result schemas remain the public jobs transport.
      required: [n, dim, boxL, dt, rc, pos, vel]
      properties:
        n: { type: integer, minimum: 2, maximum: 2048 }
        dim: { const: 2 }
        boxL: { type: number, exclusiveMinimum: 5 }
        dt: { const: 0.005 }
        rc: { const: 2.5 }
        pos:
          type: array
          minItems: 4
          maxItems: 4096
          items: { type: number, minimum: 0 }
        vel:
          type: array
          minItems: 4
          maxItems: 4096
          items: { type: number }
        particles: { $ref: '#/components/schemas/ComputeParticleProperties' }
      allOf:
        - if: { required: [particles] }
          then:
            properties:
              n: { maximum: 400 }
              boxL: { minimum: 5.01, maximum: 100 }
              pos: { maxItems: 800 }
              vel: { maxItems: 800 }
          else:
            properties:
              n: { enum: [64, 256, 1024, 2048] }
              pos: { minItems: 128 }
              vel: { minItems: 128 }
    ComputeParticleProperties:
      type: object
      required: [kind, charge, sigma, eps, epsR, lambdaD, kCoulomb]
      description: |
        Optional nested ComputeJobFile.md.particles, required only for module=particles.
        Each array has exactly n entries. kind is the explicit or seeded species order;
        counts match the scene composition. charge, sigma and eps are the f32 values
        of each indexed species' charge, sigma and epsilon. Screening coefficients equal
        the scene values. All particles have unit mass; names do not affect the solver.
      properties:
        kind: { type: array, minItems: 2, maxItems: 400, items: { type: integer, minimum: 0, maximum: 15 } }
        charge: { type: array, minItems: 2, maxItems: 400, items: { type: number, minimum: -8, maximum: 8 } }
        sigma: { type: array, minItems: 2, maxItems: 400, items: { type: number, minimum: 0.1, maximum: 2 } }
        eps: { type: array, minItems: 2, maxItems: 400, items: { type: number, minimum: 0, maximum: 4 } }
        epsR: { type: number, minimum: 1, maximum: 200 }
        lambdaD: { type: number, minimum: 0.1, maximum: 100 }
        kCoulomb: { type: number, minimum: 0, maximum: 10 }
    MdInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: md }
        scene:
          type: object
          required: [N, temperature, thermostat, barostat, targetP, tauP, steps, seed]
          description: Seeded 2D single-component Lennard-Jones lattice, initial L=sqrt(N/0.8), cutoff 2.5 and dt=0.005 in reduced units. Velocity-Verlet with fixed four-step thermostat batches (last batch may be shorter), independent of playback. Barostat is CPU-only. Unit-scale and color controls do not change the physics. N*N*steps is bounded by 268435456; a box at or below twice the cutoff or non-finite evolution fails the job.
          properties:
            N: { type: integer, enum: [64, 256, 1024, 2048] }
            temperature: { type: number, minimum: 0.05, maximum: 2.5, description: Initial temperature setting and velocity-rescaling target when thermostat is enabled. }
            thermostat: { type: boolean }
            barostat: { type: boolean, description: Existing weak-coupling isotropic pressure control; not an exact NPT sampler. }
            targetP: { type: number, minimum: -1, maximum: 8 }
            tauP: { type: number, minimum: 0.1, maximum: 3 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            seed: { type: integer, minimum: 0, maximum: 4294967295 }
          allOf:
            - if: { properties: { N: { const: 1024 } } }
              then: { properties: { steps: { maximum: 256 } } }
            - if: { properties: { N: { const: 2048 } } }
              then: { properties: { steps: { maximum: 64 } } }
    MdOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: md }
        result:
          type: object
          required: [steps, dt, time, pos, speed, observables, history, rdf, diffusion]
          properties:
            steps: { type: integer, minimum: 1, maximum: 2000, description: Must equal requested steps. }
            dt: { const: 0.005 }
            time: { type: number, minimum: 0, description: Completed steps multiplied by dt. }
            pos: { type: array, minItems: 128, maxItems: 4096, items: { type: number, minimum: 0 }, description: Exactly 2*N interleaved x/y coordinates in the current periodic box; FP32 serialized as JSON numbers. }
            speed: { type: array, minItems: 64, maxItems: 2048, items: { type: number, minimum: 0 }, description: Exactly N particle speed magnitudes. }
            observables:
              type: object
              required: [temperature, kinetic, potential, total, pressure, msd, boxL, volume, density]
              description: Reduced units; temperature=kinetic/N, total=kinetic+potential, volume=boxL^2 (area in 2D), density=N/volume. Without pressure control boxL remains sqrt(N/0.8). Raw MSD uses unwrapped coordinates and includes affine box scaling when pressure control is enabled.
              properties:
                temperature: { type: number, minimum: 0 }
                kinetic: { type: number, minimum: 0 }
                potential: { type: number }
                total: { type: number }
                pressure: { type: number }
                msd: { type: number, minimum: 0 }
                boxL: { type: number, exclusiveMinimum: 5 }
                volume: { type: number, exclusiveMinimum: 0 }
                density: { type: number, exclusiveMinimum: 0 }
            history:
              type: array
              minItems: 2
              maxItems: 501
              description: Exactly ceil(steps/4)+1 samples. Initial zero displacement at step 0, then every four steps and the final partial batch. Each timestamp is step*dt; the last MSD equals observables.msd.
              items:
                type: object
                required: [step, time, msd]
                properties:
                  step: { type: integer, minimum: 0, maximum: 2000 }
                  time: { type: number, minimum: 0 }
                  msd: { type: number, minimum: 0 }
            rdf:
              type: object
              required: [r, g]
              description: Instantaneous radial distribution of the final configuration using the current box. Bin centers r[i]=(i+0.5)*boxL/120.
              properties:
                r: { type: array, minItems: 60, maxItems: 60, items: { type: number, minimum: 0 } }
                g: { type: array, minItems: 60, maxItems: 60, items: { type: number, minimum: 0 } }
            diffusion:
              description: Null under pressure control or with fewer than four history points. Otherwise a finite-window MSD fit after skipping floor(0.2*history.length) samples, D=slope/4 for 2D. Not proof of a long-time diffusion coefficient or phase identity.
              oneOf:
                - { type: 'null' }
                - type: object
                  required: [D, slope, intercept, r2, nFit]
                  properties:
                    D: { type: number }
                    slope: { type: number }
                    intercept: { type: number }
                    r2: { type: number, minimum: 0, maximum: 1 }
                    nFit: { type: integer, minimum: 4, maximum: 501 }

    DisplayInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: display }
        scene:
          description: Ideal static emission/mixing/polarization relations, CPU FP64.
          oneOf:
            - type: object
              required: [mode, bandgap]
              properties:
                mode: { const: LED }
                bandgap: { type: number, minimum: 1.6, maximum: 3.4, description: eV }
            - type: object
              required: [mode, channels]
              properties:
                mode: { const: OLED }
                channels: { type: array, minItems: 3, maxItems: 3, items: { type: number, minimum: 0, maximum: 1 } }
            - type: object
              required: [mode, rotationDeg]
              properties:
                mode: { const: LCD }
                rotationDeg: { type: number, minimum: 0, maximum: 90, description: Rotation after the first polarizer and before its crossed analyzer. }
    DisplayRgb:
      type: array
      minItems: 3
      maxItems: 3
      items: { type: integer, minimum: 0, maximum: 255 }
    DisplayOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: display }
        result:
          oneOf:
            - type: object
              required: [mode, wavelengthNm, rgb, inColorRange]
              properties:
                mode: { const: LED }
                wavelengthNm: { type: number, exclusiveMinimum: 0, description: 1240/bandgap. }
                rgb: { $ref: '#/components/schemas/DisplayRgb' }
                inColorRange: { type: boolean, description: Approximate color mapping covers 380–750 nm; black outside this range does not mean no emission. }
            - type: object
              required: [mode, rgb, subpixels]
              properties:
                mode: { const: OLED }
                rgb: { $ref: '#/components/schemas/DisplayRgb' }
                subpixels: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/DisplayRgb' } }
            - type: object
              required: [mode, transmission, rgb, anglesDeg, transmissions]
              properties:
                mode: { const: LCD }
                transmission: { type: number, minimum: 0, maximum: 1, description: "cos^2(90-rotationDeg), normalized after the first polarizer." }
                rgb: { $ref: '#/components/schemas/DisplayRgb' }
                anglesDeg: { type: array, minItems: 91, maxItems: 91, items: { type: number, minimum: 0, maximum: 90 } }
                transmissions: { type: array, minItems: 91, maxItems: 91, items: { type: number, minimum: 0, maximum: 1 } }
    ParticleInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: particles }
        scene:
          type: object
          required: [species, boxL, temperature, thermostat, epsR, lambdaD, kCoulomb, steps, seed]
          description: |
            User-defined 2D periodic equal-mass particle MD, reduced units.
            Heterogeneous shifted LJ with Lorentz–Berthelot mixing plus screened
            Coulomb; cutoff 2.5, velocity Verlet dt=0.005. Species names are metadata,
            never solver dispatch keys. PEDOT:PSS is one editable example only.
            N=sum(species.count) must be 2..400; steps <= min(2000,floor(268435456/N^2)).
            Without kind, seeded Fisher–Yates shuffles species indices before assigning coordinates.
            Explicit kind and velocities preserve imported particle assignments and initial motion.
            CPU execution uses the same Rust native/WASM force, integration, readout and RDF.
            FP32 particle fields and FP64 arithmetic/statistics are reported as mixed precision.
            Screened Coulomb uses a shared deterministic exp(-x) approximation with a tested
            relative error bound of 2e-15 plus one minimum subnormal; WebGPU uses FP32 WGSL exp.
            All masses equal 1. No bonds, electronic structure or reaction model.
          properties:
            species:
              type: array
              minItems: 1
              maxItems: 16
              items:
                type: object
                required: [name, count, charge, sigma, epsilon]
                properties:
                  name: { type: string, minLength: 1, maxLength: 80, description: Nonblank and unique within this input. }
                  count: { type: integer, minimum: 1, maximum: 400 }
                  charge: { type: number, minimum: -8, maximum: 8 }
                  sigma: { type: number, minimum: 0.1, maximum: 2 }
                  epsilon: { type: number, minimum: 0, maximum: 4 }
            boxL: { type: number, minimum: 5.01, maximum: 100 }
            temperature: { type: number, minimum: 0.1, maximum: 2 }
            thermostat: { type: boolean, description: Fixed four-step velocity-rescaling batches with the actual remainder in the final batch. }
            epsR: { type: number, minimum: 1, maximum: 200 }
            lambdaD: { type: number, minimum: 0.1, maximum: 100 }
            kCoulomb: { type: number, minimum: 0, maximum: 10 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            seed: { type: integer, minimum: 0, maximum: 4294967295 }
            positions:
              type: array
              minItems: 4
              maxItems: 800
              items: { type: number, minimum: 0, exclusiveMaximum: 100 }
              description: Optional N*2 x,y coordinates in particle-index order (explicit kind or seeded species order). Each must be below boxL; no coincident FP32 positions. Omit to generate a lattice.
            velocities:
              type: array
              minItems: 4
              maxItems: 800
              items: { type: number, minimum: -16, maximum: 16 }
              description: Optional N*2 initial vx,vy values; used unchanged instead of seeded velocities. Temperature only controls the thermostat when these are supplied. Omit to seed velocities using temperature.
            kind:
              type: array
              minItems: 2
              maxItems: 400
              items: { type: integer, minimum: 0, maximum: 15 }
              description: Optional N species indices. Each index must exist and counts must equal species.count. Omit for seeded species shuffling.
    ParticleOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: particles }
        result:
          type: object
          required: [steps, dt, time, pos, speed, kind, charge, observables, rdf]
          description: Final snapshot. Particle array lengths and explicit or seeded species/charges must match the input. Numbers are finite; CPU arithmetic uses FP64 with FP32 particle arrays. Unknown response fields are tolerated.
          properties:
            steps: { type: integer, minimum: 1, maximum: 2000 }
            dt: { const: 0.005 }
            time: { type: number, exclusiveMinimum: 0, description: steps*dt }
            pos: { type: array, minItems: 4, maxItems: 800, items: { type: number, minimum: 0, maximum: 100 } }
            speed: { type: array, minItems: 2, maxItems: 400, items: { type: number, minimum: 0 } }
            kind: { type: array, minItems: 2, maxItems: 400, items: { type: integer, minimum: 0, maximum: 15 }, description: Indices into the submitted species array. }
            charge: { type: array, minItems: 2, maxItems: 400, items: { type: number, minimum: -8, maximum: 8 } }
            observables:
              type: object
              required: [temperature, kinetic, potential, total, pressure, msd, boxL, volume, density, totalCharge]
              properties:
                temperature: { type: number, minimum: 0 }
                kinetic: { type: number, minimum: 0 }
                potential: { type: number }
                total: { type: number, description: kinetic+potential }
                pressure: { type: number }
                msd: { type: number, minimum: 0 }
                boxL: { type: number, minimum: 5.01, maximum: 100 }
                volume: { type: number, exclusiveMinimum: 0, description: boxL^2 }
                density: { type: number, exclusiveMinimum: 0, description: N/volume }
                totalCharge: { type: number, description: Sum of the fixed per-particle FP32 charges; neutrality is not assumed. }
            rdf:
              type: object
              required: [r, g]
              description: Instantaneous all-particle RDF, 50 bins up to boxL/2; not a material-specific conductivity estimator.
              properties:
                r: { type: array, minItems: 50, maxItems: 50, items: { type: number, minimum: 0 } }
                g: { type: array, minItems: 50, maxItems: 50, items: { type: number, minimum: 0 } }

    FluidInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: fluid }
        scene:
          type: object
          required: [viscosity, diffusion, rotation, decay, steps, seeds]
          description: |
            Reduced 2D Stable Fluids: 100x100 grid, dt=0.12,
            8 in-place Gauss–Seidel pressure iterations. Initial velocity is
            vx=(y-50)*rotation, vy=-(x-50)*rotation at interior grid indices.
            Seeds add initial dye/velocity in clipped interior disks.
            Dye retention is applied at each physics step, independent of playback.
            Passive dye advection is not exactly mass-conservative.
            With inlet omitted, all outer boundaries reflect normal velocity.
            With inlet present, add its speed to initial vx; left velocity face is
            (speed,0), right velocity has zero gradient and right pressure face is zero.
            Top/bottom remain free-slip. Replenish left dye columns x=0,1 each step
            where y % spacing < width. These are qualitative open-flow boundaries,
            without an outlet backflow treatment. Solid-cell masking does not
            implement a body-fitted pressure solve or prevent backtraces across solids.
          properties:
            viscosity: { type: number, minimum: 0, maximum: 0.0001 }
            diffusion: { type: number, minimum: 0, maximum: 0.0001 }
            rotation: { type: number, minimum: -0.04, maximum: 0.04 }
            decay: { type: number, minimum: 0.9, maximum: 1 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            inlet:
              type: object
              required: [speed, density, spacing, width]
              properties:
                speed: { type: number, minimum: 0, maximum: 3 }
                density: { type: number, minimum: 0, maximum: 100 }
                spacing: { type: integer, minimum: 1, maximum: 98 }
                width: { type: integer, minimum: 1, maximum: 98, description: Must not exceed spacing. }
            obstacle:
              type: array
              minItems: 10000
              maxItems: 10000
              items: { type: integer, enum: [0, 1] }
              description: Row-major static solid mask; two outer cell layers must be zero. Solid cells have zero dye and velocity.
            seeds:
              type: array
              maxItems: 64
              items:
                type: object
                required: [x, y, radius, density, vx, vy]
                properties:
                  x: { type: integer, minimum: 1, maximum: 98 }
                  y: { type: integer, minimum: 1, maximum: 98 }
                  radius: { type: integer, minimum: 1, maximum: 12 }
                  density: { type: number, minimum: 0, maximum: 100 }
                  vx: { type: number, minimum: -4, maximum: 4 }
                  vy: { type: number, minimum: -4, maximum: 4 }
    FluidOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: fluid }
        result:
          type: object
          required: [nx, steps, dt, time, density, vx, vy, peakDensity, meanDensity, maxSpeed, gridDivergence]
          properties:
            nx: { const: 100 }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            dt: { const: 0.12 }
            time: { type: number, exclusiveMinimum: 0, description: steps*dt }
            density: { type: array, minItems: 10000, maxItems: 10000, items: { type: number, minimum: 0 } }
            vx: { type: array, minItems: 10000, maxItems: 10000, items: { type: number } }
            vy: { type: array, minItems: 10000, maxItems: 10000, items: { type: number } }
            solid:
              type: array
              minItems: 10000
              maxItems: 10000
              items: { type: integer, enum: [0, 1] }
              description: Required when the input includes obstacle; must equal that mask. Omitted for unmasked scenes.
            peakDensity: { type: number, minimum: 0 }
            meanDensity: { type: number, minimum: 0, description: Arithmetic mean over all grid cells, including the boundary. }
            maxSpeed: { type: number, minimum: 0 }
            gridDivergence: { type: number, minimum: 0, description: Peak absolute central grid-index velocity difference; not a calibrated SI divergence. }
