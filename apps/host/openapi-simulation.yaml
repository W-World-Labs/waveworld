                properties:
                  x0: { type: number }
                  y0: { type: number }
                  x1: { type: number }
                  y1: { type: number }
                  intensity: { type: number }
                  wavelengthNm: { type: number }
            hits:
              type: array
              maxItems: 20000
              items:
                type: object
                required: [componentId, kind, x, y, intensity, wavelengthNm]
