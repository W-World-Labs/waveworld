        kind: { enum: [laser, mirror, lens, interface, screen, blocker, polarizer, splitter] }
        x: { type: number, minimum: 0, maximum: 960 }
        y: { type: number, minimum: 0, maximum: 560 }
        rot: { type: number, minimum: -3600, maximum: 3600 }
        length: { type: number, minimum: 0, maximum: 2000 }
        power: { type: number, minimum: 0, maximum: 100 }
        wavelengthNm: { type: number, minimum: 1, maximum: 10000 }
        focalLength: { type: number, minimum: -10000, maximum: 10000 }
        n: { type: number, minimum: 1, maximum: 100 }
        polAngleDeg: { type: number, minimum: -10000, maximum: 10000 }
        splitT: { type: number, minimum: 0, maximum: 1 }
