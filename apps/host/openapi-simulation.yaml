      description: |
        Exact native-only host-f64 operations route through the w-sim-cuda binary
        when requirements.backends contains cuda. backend=host selects host-f64
        mathematics and makes no GPU calculation claim. There is no browser or
        JavaScript fallback. Unknown selectors and arbitrary cst-* strings are
        rejected. Existing laser {pump,steps}, FDTD scene, and Faraday scene
        teaching inputs remain on their existing path. Other operation fields are
        validated by the selected native operation.
    EmWave3DInput:
      type: object
      required: [module, params]
      properties:
        module: { const: emwave3d }
        params:
          type: object
          required: [waveNumber, amplitude, time]
          description: Reduced units with c=1; Ey=A*sin(k*(z-t)), cBx=-Ey. Time is captured when switching to backend.
          properties:
            waveNumber: { type: number, minimum: 0.3, maximum: 1.6 }
            amplitude: { type: number, minimum: 0, maximum: 4 }
            time: { type: number, minimum: 0, maximum: 1000000 }
    EmWave3DOutput:
      type: object
      required: [module, fields]
      properties:
        module: { const: emwave3d }
        fields:
          type: object
          required: [z, ey, cbx, wavelength]
          properties:
            z: { type: array, minItems: 140, maxItems: 140, items: { type: number }, description: Uniform samples from -14 to +14. }
            ey: { type: array, minItems: 140, maxItems: 140, items: { type: number } }
            cbx: { type: array, minItems: 140, maxItems: 140, items: { type: number } }
            wavelength: { type: number, minimum: 0 }
    AntennaLinkParams:
