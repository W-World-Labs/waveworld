              items: { type: number, minimum: 0, maximum: 1 }
            prDbm: { type: [number, 'null'], description: Null denotes ideal zero power (-infinity dBm) at an axial null or orthogonal polarization. }
            fsplDb: { type: number }
            plf: { type: number, minimum: 0, maximum: 1 }
    LaserInput:
      type: object
      required: [module, pump, steps]
      description: Existing reduced-unit rate equations, N=S=0 initially, Euler dt=0.02. Iteration yields for cancellation.
      properties:
        module: { const: laser }
        pump: { type: number, minimum: 0, maximum: 4000 }
        steps: { type: integer, minimum: 1, maximum: 2000 }
    LaserOutput:
      type: object
      required: [module, state, characteristics, steps, dt]
      properties:
        module: { const: laser }
        steps: { type: integer, minimum: 1, maximum: 2000, description: Equals requested steps. }
        dt: { const: 0.02 }
        state:
          type: object
          required: [N, S]
          properties:
            N: { type: number, minimum: 0 }
            S: { type: number, minimum: 0 }
        characteristics:
          type: object
          required: [threshold, pumpMax, curve, steadyPhotons]
          description: Analytic steady states of the same equations, distinct from the finite transient state.
          properties:
            threshold: { type: number, minimum: 0 }
            pumpMax: { type: number, minimum: 0 }
            steadyPhotons: { type: number, minimum: 0 }
            curve:
              type: array
              minItems: 51
              maxItems: 51
              items:
                type: object
                required: [p, s]
                properties:
                  p: { type: number, minimum: 0 }
                  s: { type: number, minimum: 0 }
    PhasedArrayInput:
      type: object
      required: [module, params]
      properties:
        module: { const: phasedarray }
        params:
          type: object
          required: [n, dOverLambda, steerDeg]
          properties:
            n: { type: integer, minimum: 2, maximum: 48 }
            dOverLambda: { type: number, minimum: 0.25, maximum: 1.5 }
            steerDeg: { type: number, minimum: -80, maximum: 80 }
    PhasedArrayOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: phasedarray }
        result:
          type: object
          required: [pattern, phases, beamwidthDeg, beamwidthClipped, grating]
          properties:
            pattern:
              type: array
              minItems: 361
              maxItems: 361
              description: Uniform samples from -90 to +90 degrees of the normalized array factor.
              items:
                type: object
                required: [theta, gain]
                properties:
                  theta: { type: number, minimum: -90, maximum: 90 }
                  gain: { type: number, minimum: 0, maximum: 1.000000000001 }
            phases: { type: array, minItems: 2, maxItems: 48, items: { type: number }, description: Per-element excitation phases in radians; length equals requested n. }
            beamwidthDeg: { type: number, minimum: 0, maximum: 180, description: Half-power width around the requested steering angle within the visible interval. }
            beamwidthClipped: { type: boolean, description: One or both half-power crossings are outside the visible interval. }
            grating: { type: array, maxItems: 4, items: { type: number, minimum: -90, maximum: 90 } }
    SignalArrayInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: signal-array }
        scene:
          type: object
          required: [rows, cols, unit, input, sensing, bias, encoding, noisePeakV, seed, regularization]
          description: |
            N=rows*cols must be 1..64. K=sensing.length is 1..64. Input is row-major;
            sensing has K rows of N coefficients in V/input-unit; bias has K offsets in V.
            All input, sensing, bias and custom-code values are finite with magnitude <=1e6.
            Direct and Hadamard have M=K; Hadamard requires K to be a power of two and uses
            normalized Sylvester order. Custom code has M=1..128 rows of K coefficients.
            One static snapshot with run.maxSteps=1 and precision=float64.
          properties:
            rows: { type: integer, minimum: 1, maximum: 64 }
            cols: { type: integer, minimum: 1, maximum: 64 }
            unit: { type: string, minLength: 1, maxLength: 32, description: Input unit; must not be all whitespace. }
            input: { $ref: '#/components/schemas/SignalArrayCoefficients' }
            sensing:
              type: array
              minItems: 1
              maxItems: 64
              items: { $ref: '#/components/schemas/SignalArrayCoefficients' }
            bias: { $ref: '#/components/schemas/SignalArrayCoefficients' }
            encoding:
              oneOf:
                - type: object
                  required: [kind]
                  properties:
                    kind: { enum: [direct, hadamard] }
                - type: object
                  required: [kind, matrix]
                  properties:
                    kind: { const: custom }
                    matrix:
                      type: array
                      minItems: 1
                      maxItems: 128
                      items: { $ref: '#/components/schemas/SignalArrayCoefficients' }
            noisePeakV: { type: number, minimum: 0, maximum: 1000000, description: Uniform noise peak in V; seeded Mulberry32 consumes one draw per measurement including zero noise. }
            seed: { type: integer, minimum: 0, maximum: 4294967295 }
            regularization: { type: number, minimum: 0, maximum: 1000000, description: Ridge lambda in squared sensing-operator units. No extra independent measurements are implied. }
            readout:
              type: object
              required: [resistanceOhm, capacitanceF, dwellS, initialV]
              description: Optional shared RC node; omit for ideal readout. Samples code rows sequentially while the spatial input is held constant. All parameters are SI units.
              properties:
                resistanceOhm: { type: number, minimum: 0.001, maximum: 1000000000000 }
                capacitanceF: { type: number, minimum: 1.0e-15, maximum: 1 }
                dwellS: { type: number, minimum: 1.0e-12, maximum: 1000 }
                initialV: { type: number, minimum: -1000000, maximum: 1000000 }
    SignalArrayCoefficients:
      type: array
      minItems: 1
      maxItems: 64
      items: { type: number, minimum: -1000000, maximum: 1000000 }
    SignalArrayOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: signal-array }
        result:
          type: object
          required: [encoding, sensorV, measuredV, reconstructed, error, rank, rankTolerance, status, rmse, residualRmsV]
          description: |
            Encoding is the actual M by K code, sensorV has K values, measuredV has M.
            rank is the column-pivoted QR numerical rank of the sampled sensing operator
            (CS for ideal readout; its causal RC response when readout is present), not an SVD condition number.
            Threshold is eps*max(M,N)*first-pivot-column-norm, in operator units.
            With lambda=0 and rank<N, status=rank-deficient and reconstructed/error/rmse/
            residualRmsV are all null. Otherwise vectors have N values and metrics are finite.
            With lambda>0 status=regularized even when the sampled operator is full rank; all result numbers
            are finite with magnitude <=1e100. error=xhat-input; RMSE=sqrt(mean(error^2));
            residualRmsV is the RMS measurement residual after accounting for the known
            bias and initial capacitor voltage, excluding the ridge penalty.
            New results always provide all four readout diagnostics. Without RC, idealV=sampledV,
            settlingFraction=1 and readoutTauS=0. Historical ideal results may omit all four;
            RC results must include them. The measuredV noise is added after sampledV.
          dependentRequired:
            idealV: [sampledV, settlingFraction, readoutTauS]
            sampledV: [idealV, settlingFraction, readoutTauS]
            settlingFraction: [idealV, sampledV, readoutTauS]
            readoutTauS: [idealV, sampledV, settlingFraction]
          properties:
            encoding:
              type: array
              minItems: 1
              maxItems: 128
              items:
                type: array
                minItems: 1
                maxItems: 64
                items: { type: number }
            sensorV: { type: array, minItems: 1, maxItems: 64, items: { type: number } }
            measuredV: { type: array, minItems: 1, maxItems: 128, items: { type: number } }
            idealV: { type: array, minItems: 1, maxItems: 128, items: { type: number }, description: Encoded target voltage Cv before RC settling or noise. }
            sampledV: { type: array, minItems: 1, maxItems: 128, items: { type: number }, description: Voltage at each acquisition endpoint before noise. }
            settlingFraction: { type: number, minimum: 0, maximum: 1 }
            readoutTauS: { type: number, minimum: 0, maximum: 1000000000000, description: RC time constant in seconds; strictly positive when readout is present. }
            reconstructed: { type: [array, 'null'], minItems: 1, maxItems: 64, items: { type: number } }
            error: { type: [array, 'null'], minItems: 1, maxItems: 64, items: { type: number } }
            rank: { type: integer, minimum: 0, maximum: 64 }
            rankTolerance: { type: number, minimum: 0 }
            status: { enum: [solved, rank-deficient, regularized] }
            rmse: { type: [number, 'null'], minimum: 0 }
            residualRmsV: { type: [number, 'null'], minimum: 0 }
    NljdInput:
      type: object
      required: [module, kind]
      description: Unit cosine input to a preset cubic polynomial; no physical frequency response. Illustration density is display-only.
      properties:
        module: { const: nljd }
        kind: { enum: [semiconductor, corrosion, metal] }
    NljdOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: nljd }
        result:
          type: object
          required: [coefficients, harmonics, relative, verdict, transfer]
          properties:
            coefficients:
              type: object
              required: [a2, a3]
              properties:
                a2: { type: number }
                a3: { type: number }
            harmonics:
              type: object
              required: [f1, f2, f3]
              properties:
                f1: { type: number, minimum: 0 }
                f2: { type: number, minimum: 0 }
                f3: { type: number, minimum: 0 }
            relative:
              type: object
              required: [f1, f2, f3]
              description: Amplitude ratios normalized by the sum of the three amplitudes, not powers.
              properties:
                f1: { type: number, minimum: 0, maximum: 1 }
                f2: { type: number, minimum: 0, maximum: 1 }
                f3: { type: number, minimum: 0, maximum: 1 }
            verdict: { enum: [semiconductor, corrosion, metal], description: Model classification, not a measured detection result. }
            transfer: { type: array, minItems: 81, maxItems: 81, items: { type: number }, description: Polynomial output at inputs i/40-1 for i=0..80. }
    RadarInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: radar }
        scene:
          type: object
          required: [mode, steps, probes]
          description: >-
            Fixed 200x200 reduced-unit scalar-wave scene, zero initial fields,
            leapfrog coefficient a=0.22 and per-step damping 0.9985. Fixed-zero
            outer boundary and target masks; no distinct material or RCS models.
            TX is at (24,100). Pulse displacements repeat every 220 lattice steps
            for phases 0..5 with radius 2 and amplitude 6*exp(-(phase-3)^2/2).
            CW prescribes u and uPrev at TX as 3*sin(step*0.06*0.35*2*pi) before stepping.
            Changing probe positions restarts the scene. Visible channel count is display-only.
          properties:
            mode: { enum: [pulse, cw] }
            steps: { type: integer, minimum: 1, maximum: 2000 }
            probes:
              type: array
              minItems: 4
              maxItems: 4
              items:
                oneOf:
                  - { type: 'null', description: Unplaced probe slot. }
                  - type: object
                    required: [x, y]
                    properties:
                      x: { type: integer, minimum: 0, maximum: 199 }
                      y: { type: integer, minimum: 0, maximum: 199 }
    RadarOutput:
      type: object
      required: [module, nx, steps, sampleStride, field, traces, readout]
      properties:
        module: { const: radar }
        nx: { const: 200 }
        steps: { type: integer, minimum: 1, maximum: 2000, description: Equals requested steps. }
        sampleStride: { const: 2, description: Sample after every two lattice steps and also the final odd step. }
        field: { type: array, minItems: 40000, maxItems: 40000, items: { type: number }, description: Final FP32 scalar field serialized as JSON numbers, indexed x+y*200. }
        traces:
          type: array
          minItems: 4
          maxItems: 4
          description: Latest min(256,ceil(steps/2)) samples for each placed probe; empty for unplaced probes.
          items: { type: array, maxItems: 256, items: { type: number } }
        readout:
          type: array
          minItems: 4
          maxItems: 4
          items:
            oneOf:
              - { type: 'null', description: Unplaced probe. }
              - type: object
                required: [v, pp]
                properties:
                  v: { type: number, description: Latest sample. }
                  pp: { type: number, minimum: 0, description: Peak-to-peak of the retained trace. }
    LocalizationInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: localization }
        scene:
          type: object
          required: [target, noise, seed, bandwidth]
          description: >-
            Fixed anchors (60,60), (460,60), (60,320), (460,320), in pixels.
            Each measured distance adds uniform noise in [-noise,+noise), clamped
            to nonnegative. Four noise samples use uint32 LCG
            seed=(1664525*seed+1013904223) mod 2^32, normalized by 2^32.
            New measurement increments the seed; animation never changes it.
            Bandwidth affects only the displayed theoretical resolution c/(2B), c=300.
          properties:
            target:
              type: object
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 520 }
                y: { type: number, minimum: 0, maximum: 380 }
            noise: { type: number, minimum: 0, maximum: 25 }
            seed: { type: integer, minimum: 0, maximum: 4294967295 }
            bandwidth: { type: number, minimum: 6, maximum: 120 }
    LocalizationOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: localization }
        result:
          type: object
          required: [ranges, est, err, resolution]
          properties:
            ranges: { type: array, minItems: 4, maxItems: 4, items: { type: number, minimum: 0 } }
            est: { $ref: '#/components/schemas/Position2D' }
            err: { type: number, minimum: 0, description: Distance between estimate and simulated target in pixels. }
            resolution: { type: number, minimum: 0, description: Theoretical c/(2B) in reduced units; not localization error. }
    Position2D:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    TdoaInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: tdoa }
        scene:
          type: object
          required: [source, noise, seed]
          description: >-
            Fixed receivers (90,320), (550,320), (320,60), (120,110); receiver 0
            is the reference. Distance differences are in pixels, with uniform
            noise in [-noise/2,+noise/2) using the same uint32 LCG as localization.
            The solver compares all receiver residuals when choosing R0 roots.
          properties:
            source:
              type: object
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 640 }
                y: { type: number, minimum: 0, maximum: 380 }
            noise: { type: number, minimum: 0, maximum: 20 }
            seed: { type: integer, minimum: 0, maximum: 4294967295 }
    TdoaOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: tdoa }
        result:
          type: object
          required: [diffs, est, err, curves]
          properties:
            diffs: { type: array, minItems: 4, maxItems: 4, items: { type: number }, description: First entry is zero; others are distance minus reference distance. }
            est: { $ref: '#/components/schemas/Position2D' }
            err: { type: number, minimum: 0 }
            curves:
              type: array
              minItems: 3
              maxItems: 3
              description: >-
                One constraint per non-reference receiver. 121 points sampled over
                transverse span -520..520, or an empty array when the noisy distance
                difference exceeds the baseline. Equality to the baseline yields a ray.
              items:
                oneOf:
                  - { type: array, maxItems: 0 }
                  - type: array
                    minItems: 121
                    maxItems: 121
                    items: { $ref: '#/components/schemas/Position2D' }
    StmInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: stm }
        scene:
          type: object
          required: [mode, tipHeight, setCurrent]
          description: >-
            Fixed 240-point synthetic surface in nm, kappa=11.5/nm and normalized I0=1.
            Constant-height uses I=I0*exp(-2*kappa*gap). Constant-current uses the ideal
            static inverse gap=ln(I0/setCurrent)/(2*kappa), without a feedback controller.
            Both return the full line; the display cursor is not a compute parameter.
          properties:
            mode: { enum: [height, current] }
            tipHeight: { type: number, minimum: 0.18, maximum: 0.42 }
            setCurrent: { type: number, minimum: 0.005, maximum: 0.06 }
    StmOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: stm }
        result:
          type: object
          required: [surface, gaps, tipHeights, currents]
          properties:
            surface: { type: array, minItems: 240, maxItems: 240, items: { type: number, minimum: 0 } }
            gaps: { type: array, minItems: 240, maxItems: 240, items: { type: number, minimum: 0 } }
            tipHeights: { type: array, minItems: 240, maxItems: 240, items: { type: number, minimum: 0 } }
            currents: { type: array, minItems: 240, maxItems: 240, items: { type: number, minimum: 0 } }
    AfmInput:
      type: object
      required: [module, scene]
      properties:
        module: { const: afm }
        scene:
          type: object
          required: [base, k]
          description: >-
            Fixed 220-point synthetic surface in reduced LJ units (epsilon=sigma=1).
            Gap=max(0.2,base-surface), force is the existing LJ derivative and
            deflection=force/k. This one-way approximation does not solve coupled
            tip-contact equilibrium or topography inversion. Cursor is display-only.
          properties:
            base: { type: number, minimum: 2.1, maximum: 3.2 }
            k: { type: number, minimum: 2, maximum: 20 }
    AfmOutput:
      type: object
      required: [module, result]
      properties:
        module: { const: afm }
        result:
          type: object
          required: [surface, gaps, forces, deflections]
          properties:
            surface: { type: array, minItems: 220, maxItems: 220, items: { type: number, minimum: 0 } }
            gaps: { type: array, minItems: 220, maxItems: 220, items: { type: number, minimum: 0 } }
            forces: { type: array, minItems: 220, maxItems: 220, items: { type: number }, description: Positive repulsion, negative attraction. }
            deflections: { type: array, minItems: 220, maxItems: 220, items: { type: number } }
